---
# Findings of zizmor that are accepted for a time. One entry is one rule in one
# file and carries its expiry and reason on the same line; tools/exceptions.py
# fails the gate on an entry without them and on an expired one.
rules:
  # The forge's `$/` form for a call inside the repository: actionlint 1.7.12,
  # the newest release, refuses it (upstream issues 711 and 732).
  self-repository:
    ignore:
      - licence-check.yml # expires 2026-12-31: actionlint refuses the `$/` form
      - scorecard-check.yml # expires 2026-12-31: actionlint refuses the `$/` form
      - secret-scan.yml # expires 2026-12-31: the path is our checkout; `$/` names the caller
