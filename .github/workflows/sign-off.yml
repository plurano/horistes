---
# Sign-off (reusable): judge every pull-request commit against its author's
# name and email, with bot and clean merge exemptions (ADR-0095).
# The self-test proves acceptance and refusal before the caller is judged.
# The check is reported as "<calling job> / Sign-off".
name: Sign-off

on:
  workflow_call:
    inputs:
      runner:
        description: Label of the runner the job runs on.
        type: string
        required: false
        default: ubuntu-26.04

permissions: {}

jobs:
  sign-off:
    name: Sign-off
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Check out the caller
        if: github.event.pull_request.draft != true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check out the sign-off judge
        if: github.event.pull_request.draft != true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: sign-off-source
          persist-credentials: false
          sparse-checkout: |
            tools/commit_message.py
          sparse-checkout-cone-mode: false

      - name: Self-test sign-off on planted commits
        if: github.event.pull_request.draft != true
        run: python3 -I -B sign-off-source/tools/commit_message.py self-test

      # The checked-out merge has the base branch tip as parent 1 and the PR
      # head as parent 2. Parent 1..parent 2 excludes base-branch commits taken
      # by a merge, whatever base the event recorded. The expected-head check
      # refuses a checkout that is not this event's merge.
      - name: Judge pull-request sign-offs
        if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 -I -B sign-off-source/tools/commit_message.py
          range --merge HEAD --expect-head "$HEAD_SHA"

      - name: Report sign-offs are judged on the pull request
        if: github.event_name != 'pull_request'
        run: echo "::notice::Commit sign-offs are judged on the pull request."
