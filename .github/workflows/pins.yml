---
# Action pins: runs `make check-pins` on the workflows of this repository
# (decision records 0016 and 0017). The check asks the forge and the
# repository of every action, so it is no part of the verification gate and no
# required check. It runs on a pull request that changes a workflow, the tool
# or the tool's pins, once a week, and by hand. The weekly run is the one that
# sees a release name that was moved to another commit after the pin was
# written.
name: Action pins

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/**
      - tools/pins.py
      - tools/ciwf.py
      - tools/forge.py
      - requirements/tools.txt
      - Makefile
  schedule:
    - cron: "41 5 * * 3"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins:
    name: Action pins
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The token of the run reads this repository and the public repositories
      # of the actions. The forge's counter endpoint reads 0 for this token, so
      # the count comes from the header of one ordinary request before the
      # check and one after it; the second of the two is taken off. Other runs
      # of this repository in the same minute count into the same number.
      - name: Check the pins
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          used() {
            timeout 30 gh api -i "repos/$GITHUB_REPOSITORY" \
              | sed -n 's/^[Xx]-[Rr]ate[Ll]imit-[Uu]sed: *\([0-9]*\).*/\1/p'
          }
          before="$(used)"
          status=0
          make check-pins || status=$?
          after="$(used)"
          count="not read"
          if [[ "$before" =~ ^[0-9]+$ && "$after" =~ ^[0-9]+$ ]]; then
            count=$((after - before - 1))
          fi
          echo "Forge requests of this check: $count (counter $before to $after)" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"
