---
# Licence check (reusable): every file of the calling repository carries its
# licence information, as `reuse lint` reads it. The job needs read access to
# the contents and no secret. Its check is reported as
# "<name of the calling job> / REUSE lint".
#
# The licence tool runs from the image behind fsfe/reuse-action, which the
# runner pulls from a public registry. That host has no off switch yet: it is
# a dated exception in hosts.toml (decision record 0005).
name: Licence

on:
  workflow_call:
    inputs:
      runner:
        description: Label of the runner the job runs on.
        type: string
        required: false
        default: ubuntu-26.04

permissions: {}

jobs:
  reuse:
    name: REUSE lint
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Check out the source
        if: github.event.pull_request.draft != true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: reuse lint
        if: github.event.pull_request.draft != true
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6
