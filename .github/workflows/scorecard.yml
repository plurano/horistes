---
# Scorecard (reusable): the supply-chain checks of the calling repository, as
# the OpenSSF Scorecard action reads them. The result goes to the forge's code
# scanning and is kept as an artifact for five days. Its check is reported as
# "<name of the calling job> / Analysis"; the job passes whatever it finds.
#
# The action asks four outside hosts on every run and has no switch of its
# own, so `outside_hosts`, off by default, gates the whole analysis. Two of
# those hosts are asked with the name of the calling repository, which is why
# a caller switches the analysis on in a public repository only (decision
# record 0013).
#
# A run that analyses nothing fails: with `outside_hosts` false the check
# "<name of the calling job> / Analysis" is a failed job with the reason in
# its text, and the skipped analysis job is reported as "Analysis (not
# started)" (decision record 0026). A skipped job would read as a pass.
#
# A caller that switches it on in a repository that is not public gets a
# failed check, "<name of the calling job> / Public repository", with the
# reason in its text, and the analysis does not start (decision record 0015).
# That job runs on every call, so the jobs that need it are never skipped
# for want of it.
#
# The analysis job is written to the rules the Scorecard service puts on a
# workflow before it takes a published result: one literal runner label, no
# `run` step, no `env`, no `defaults`, no container, and only steps that use
# an action of the service's list. tools/scorecard.py holds the file to them.
# That is why the runner is no input here, and why each refusal is a job of
# its own.
#
# The caller grants what the job asks: contents read, security-events write
# (code scanning) and id-token write (the signed publication; the action asks
# for the token only when `publish` is true).
name: Scorecard

on:
  workflow_call:
    inputs:
      outside_hosts:
        description: >-
          Run the analysis. The action then asks the best-practices badge
          service and the dependency insight service with the name of the
          calling repository, and the vulnerability database and the fuzzing
          build logs without it. Pass true in a public repository only.
        type: boolean
        required: false
        default: false
      publish:
        description: >-
          Publish the result under the name of the calling repository at the
          Scorecard service, signed through the public signing service and
          transparency log. The action never publishes for a private
          repository.
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  visibility:
    name: Public repository
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Refuse a repository that is not public
        shell: bash
        env:
          VISIBILITY: ${{ github.event.repository.visibility }}
          OUTSIDE_HOSTS: ${{ inputs.outside_hosts }}
          PUBLISH: ${{ inputs.publish }}
          TITLE: Repository is not public
          MESSAGE: >-
            The analysis did not run. An input that is for public
            repositories only was passed as true, and the event of this run
            gives the repository's visibility as
        run: |
          if [ "$OUTSIDE_HOSTS" = false ] && [ "$PUBLISH" = false ]; then
            exit 0
          fi
          if [ "$VISIBILITY" = public ]; then
            exit 0
          fi
          MESSAGE="$MESSAGE '$VISIBILITY'. Pass the input as the repository's visibility, or as false."
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

  switched_off:
    # Named "Analysis" when it runs, so the check of a run that analyses
    # nothing is a failure, not a skipped job.
    name: ${{ inputs.outside_hosts && 'Analysis (switched on)' || 'Analysis' }}
    needs: visibility
    if: ${{ !inputs.outside_hosts }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Refuse a run that analyses nothing
        shell: bash
        env:
          TITLE: Analysis switched off
          MESSAGE: >-
            The analysis did not run: the input outside_hosts is false, and a
            skipped analysis would read as a pass. Call this workflow from a
            public repository only, with outside_hosts passed as the
            repository's visibility.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

  analysis:
    name: ${{ inputs.outside_hosts && 'Analysis' || 'Analysis (not started)' }}
    needs: visibility
    if: inputs.outside_hosts
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # the findings go to the forge's code scanning
      id-token: write # signs the publication; asked for only when `publish` is true
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ inputs.publish }}

      - name: Keep the result file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-result
          path: results.sarif
          if-no-files-found: error
          retention-days: 5

      - name: Report the findings to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
