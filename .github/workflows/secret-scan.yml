---
# Secret scan (reusable): scan the caller's full history for secrets with
# Gitleaks. Exceptions are single commit:path:rule:line fingerprints with an
# expiry in .gitleaksignore. The self-test proves the gate against planted keys
# before the caller's history is trusted (decision record 0055).
# The check is reported as "<name of the calling job> / Secret scan".
name: Secret scan

on:
  workflow_call:
    inputs:
      runner:
        description: Label of the runner the job runs on.
        type: string
        required: false
        default: ubuntu-26.04

permissions: {}

env:
  GITLEAKS_VERSION: "v8.30.1"
  # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksum file.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  scan:
    name: Secret scan
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Check out the caller
        if: github.event.pull_request.draft != true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check out the scan script
        if: github.event.pull_request.draft != true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: secret-scan-source
          persist-credentials: false
          sparse-checkout: |
            actions/
            tools/secret_scan.py
          sparse-checkout-cone-mode: false

      - name: Install the pinned gitleaks
        if: github.event.pull_request.draft != true
        uses: ./secret-scan-source/actions/install-gitleaks
        with:
          version: ${{ env.GITLEAKS_VERSION }}
          sha256: ${{ env.GITLEAKS_SHA256 }}
          install-dir: ${{ runner.temp }}

      - name: Self-test secret scan on planted keys
        if: github.event.pull_request.draft != true
        run: |
          gitleaks="$RUNNER_TEMP/gitleaks"
          python3 -I secret-scan-source/tools/secret_scan.py --gitleaks "$gitleaks" --self-test

      - name: Scan history for secrets
        if: github.event.pull_request.draft != true
        run: |
          gitleaks="$RUNNER_TEMP/gitleaks"
          python3 -I secret-scan-source/tools/secret_scan.py --gitleaks "$gitleaks" --repository .
