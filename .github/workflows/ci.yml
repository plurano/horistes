---
# Verification gate: runs `make verify-all`, the same target a contributor runs
# locally, with the tools requirements/tools.txt pins and the engine built from
# the pinned Praetor commit.
name: Verification gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  merge_group:

permissions: {}

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  # Release tags; the update bot reads each tag with its checksum (ADR-0036).
  ACTIONLINT_VERSION: "v1.7.12"
  # SHA-256 of actionlint_1.7.12_linux_amd64.tar.gz, from the release's checksum file.
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  GITLEAKS_VERSION: "v8.30.1"
  # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksum file.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  # Published Praetor commit that builds the praetorctl this gate pins.
  PRAETOR_REF: "019b879ec69178570f53b97a113f67d62629e4c1"

jobs:
  verify:
    name: Verification gate
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # Full history: the interface check reads the base of the change, and the
      # commit-message test reads every commit since it (sign-off included).
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out pinned Praetor source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cordanaLLM/praetor
          ref: ${{ env.PRAETOR_REF }}
          path: praetor-src
          persist-credentials: false

      - name: Set up the Go toolchain declared by Praetor
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: praetor-src/go.mod
          cache: false

      - name: Build pinned praetorctl from the published Praetor commit
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: "0"
          GOFLAGS: -mod=readonly
        run: |
          test "$(git -C praetor-src rev-parse HEAD)" = "$PRAETOR_REF"
          mkdir -p "$RUNNER_TEMP/bin"
          # go vet first: the Go compiler has no warnings, so vet is the
          # warnings-as-errors form for the one Go build this gate runs.
          ( cd praetor-src && go mod download && go mod verify \
            && go vet ./... \
            && go build -trimpath -buildvcs=false \
              -o "$RUNNER_TEMP/bin/praetorctl" ./cmd/standardsctl )
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          # The Praetor checkout is a build input only; the audit and the
          # licence check must not read it as content of this repository.
          rm -rf praetor-src

      - name: Install the pinned actionlint
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --max-time 120 --retry 2 \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" actionlint

      - name: Install the pinned gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --max-time 120 --retry 2 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" gitleaks

      # Every commit of the checkout, with the tool's own rules only: a rule
      # file, an ignore file or an allow comment would let the change that
      # adds it decide what the scan reports (decision record 0028).
      - name: Scan every commit for secrets
        run: |
          unset GITLEAKS_CONFIG GITLEAKS_CONFIG_TOML
          for file in .gitleaks.toml .gitleaksignore; do
            if [ -e "$file" ]; then
              echo "::error title=Secret scan refused::$file would set the rules of the scan; remove it"
              exit 1
            fi
          done
          gitleaks git --no-banner --verbose --redact --exit-code 1 --ignore-gitleaks-allow --timeout 300 .

      # The interface is compared with the commit the change starts from.
      - name: Verification gate
        env:
          BASE_REF: >-
            ${{ github.event.pull_request.base.sha
            || github.event.merge_group.base_sha
            || github.event.before }}
        run: make verify-all BASE_REF="$BASE_REF"
