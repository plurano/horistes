---
# This repository's own licence check: a thin caller of the reusable workflow
# beside it, the same shape a consumer's caller has.
name: Licence check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  merge_group:

permissions: {}

concurrency:
  group: licence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licence:
    name: Licence
    permissions:
      contents: read
    uses: ./.github/workflows/licence.yml
