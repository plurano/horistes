---
# Merge train (reusable): one sweep over every repository the merge-train
# app is installed on, landing pull requests one at a time without a session
# or a person driving it (decision record 0029). In each repository a run does
# at most one write:
#
# - It lands the oldest pull request the forge reports CLEAN (or a state the
#   caller accepts in `accept_states`), through the merge mutation with the
#   head commit it read. The forge refuses that merge when a required check or
#   rule fails, and the app has no bypass, so nothing red lands.
# - When none is CLEAN and no armed pull request is still in flight, it arms
#   auto-merge on the oldest BEHIND pull request whose checks are not red, and
#   merges the default branch into its head (update-branch, never a rebase:
#   a forge rebase re-commits the head unsigned). The forge offers auto-merge
#   only while a pull request cannot merge at once, so BEHIND is where arming
#   happens; a CLEAN pull request is landed directly.
#
# Left alone: drafts, pull requests from forks, a base other than the default
# branch, the labels in `hold_labels`, heads in `person_branches` (release
# pull requests by default: a release is a person's act), dependency updates
# whose own commit (the update bot's, not a repin or a merge pushed on top) is
# younger than `min_age_days` (3 days, the fleet's minimum age; a security
# label or "[SECURITY]" in the title skips the wait), and archived
# repositories. A repository leaves the train when the app is uninstalled
# from it.
#
# RELEASES. A repository with release-please-config.json and
# .release-please-manifest.json on its default branch gets a second job after
# the sweep (decision record 0031): release-please with a token of the app
# limited to that repository, contents, pull requests and workflows write. It
# opens or updates the release pull request and, once a person has merged it,
# creates the release. It never merges: the train leaves heads in
# `person_branches` alone, so a release stays a person's act. The app's events
# start workflow runs, so the release pull request gets its required checks
# and the release starts the repository's `release: published` workflows.
# `switch: off` runs no release job.
#
# CREDENTIAL. One repository holds the app's private key, as the secret
# MERGE_TRAIN_APP_KEY of its environment `merge-train`; the environment lets
# only the default branch deploy, so a workflow edited on another branch never
# reads the key. The job runs in that environment and the caller passes the
# secret as `app_private_key` and the client id as `app_client_id`. The key
# signs a JWT of the app (openssl, the key through a pipe, never a file). For
# every repository the job mints a token limited to that repository, with
# contents, pull requests and workflows write and checks read (read rights
# only when `switch` is off), and revokes it when the repository is done.
# Workflows write is there because the forge refuses a merge or an
# update-branch that changes a file under .github/workflows without it: pin
# updates do, and so does an update after the default branch changed a
# workflow. Events GITHUB_TOKEN causes start no workflow run, so a head it
# updated would never get its checks. GITHUB_TOKEN gets no permission at all.
#
# A refusal in one repository is reported and the sweep goes on; the run ends
# red when any repository refused. Repositories not reached within 25 minutes
# are named in the summary.
name: Merge train

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Label of the runner the job runs on. It needs python3 and the openssl
          command; there is no default, so the caller names its own runner.
        type: string
        required: true
      app_client_id:
        description: Client id of the merge-train app.
        type: string
        required: true
      switch:
        description: on lands and updates; off only reports.
        type: string
        required: false
        default: "on"
      merge_method:
        description: SQUASH or MERGE. A forge rebase is refused (unsigned commits).
        type: string
        required: false
        default: SQUASH
      accept_states:
        description: >-
          Merge states landed besides CLEAN, separated by spaces: UNSTABLE,
          HAS_HOOKS. Only for a repository that declares them acceptable.
        type: string
        required: false
        default: ""
      min_age_days:
        description: Minimum age of a dependency update, whole days from 0 to 30.
        type: string
        required: false
        default: "3"
      hold_labels:
        description: Labels that keep a pull request out of the train, comma-separated.
        type: string
        required: false
        default: hold,do-not-merge,planted
      dependency_branches:
        description: Head prefixes of dependency updates, separated by spaces.
        type: string
        required: false
        default: renovate/ dependabot/
      person_branches:
        description: Head prefixes only a person lands, separated by spaces.
        type: string
        required: false
        default: release-please--
      security_labels:
        description: Labels that exempt a dependency update from the minimum age, comma-separated.
        type: string
        required: false
        default: security
    secrets:
      app_private_key:
        description: >-
          Private key of the merge-train app, the secret of the environment
          merge-train of the calling repository.
        required: true

permissions: {}

jobs:
  train:
    name: Merge train
    runs-on: ${{ inputs.runner }}
    environment: merge-train
    timeout-minutes: 30
    permissions: {}
    outputs:
      releases: ${{ steps.sweep.outputs.releases }}
    steps:
      - name: Land or update one pull request in every repository of the app
        id: sweep
        shell: python
        env:
          TRAIN_APP_CLIENT_ID: ${{ inputs.app_client_id }}
          TRAIN_APP_KEY: ${{ secrets.app_private_key }}
          TRAIN_SWITCH: ${{ inputs.switch }}
          TRAIN_MERGE_METHOD: ${{ inputs.merge_method }}
          TRAIN_ACCEPT_STATES: ${{ inputs.accept_states }}
          TRAIN_MIN_AGE_DAYS: ${{ inputs.min_age_days }}
          TRAIN_HOLD_LABELS: ${{ inputs.hold_labels }}
          TRAIN_DEPENDENCY_BRANCHES: ${{ inputs.dependency_branches }}
          TRAIN_PERSON_BRANCHES: ${{ inputs.person_branches }}
          TRAIN_SECURITY_LABELS: ${{ inputs.security_labels }}
        run: |
          """Merge train of every repository the app is installed on.

          In each repository it lands one clean pull request, or updates the next one.

          The app's key signs a short-lived JWT (openssl, the key passed through a pipe
          and never written to a file). With it the sweep lists the app's installations,
          reads each installation's repositories with a read-only token, and mints for
          every repository a token limited to that one repository; the train runs with
          it, and the token is revoked at once. A refusal in one repository is recorded
          and the sweep goes on with the next.

          Exit codes: 0 done, 1 a forge call failed or was refused, 3 a setting is invalid.
          """

          import base64
          import json
          import os
          import shutil
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.request
          from datetime import UTC, datetime, timedelta

          TIMEOUT = 30
          SETTLE_ROUNDS = 3
          SETTLE_SECONDS = 5
          SWEEP_SECONDS = 1500
          MAX_PAGES = 20
          JWT_SECONDS = 540
          MAX_RELEASES = 256
          WRITE_RIGHTS = {
              "contents": "write",
              "pull_requests": "write",
              "workflows": "write",
              "checks": "read",
          }
          READ_RIGHTS = {"contents": "read", "pull_requests": "read", "checks": "read"}
          LIST_RIGHTS = {"metadata": "read"}
          METHODS = ("SQUASH", "MERGE")
          ACCEPTABLE = ("UNSTABLE", "HAS_HOOKS")
          RED = ("FAILURE", "TIMED_OUT", "CANCELLED", "ACTION_REQUIRED", "STARTUP_FAILURE")
          NO_NEW_COMMITS = "There are no new commits on the base branch."
          CONFLICT = "merge conflict between base and head"
          QUERY = """
          query($owner: String!, $name: String!) {
            repository(owner: $owner, name: $name) {
              defaultBranchRef { name }
              autoMergeAllowed
              releaseConfig: object(expression: "HEAD:release-please-config.json") { oid }
              releaseManifest: object(expression: "HEAD:.release-please-manifest.json") { oid }
              pullRequests(states: OPEN, first: 100, orderBy: {field: CREATED_AT, direction: ASC}) {
                pageInfo { hasNextPage }
                nodes {
                  number id title isDraft isCrossRepository baseRefName headRefName headRefOid
                  mergeStateStatus
                  autoMergeRequest { enabledAt }
                  labels(first: 50) { nodes { name } }
                  history: commits(last: 20) {
                    nodes { commit { committedDate parents { totalCount } } }
                  }
                  latest: commits(last: 1) {
                    nodes { commit { checkSuites(first: 30) { nodes { conclusion } } } }
                  }
                }
              }
            }
          }
          """
          MERGE = """
          mutation($id: ID!, $oid: GitObjectID!, $method: PullRequestMergeMethod!) {
            mergePullRequest(input: {pullRequestId: $id, expectedHeadOid: $oid, mergeMethod: $method}) {
              pullRequest { merged }
            }
          }
          """
          ARM = """
          mutation($id: ID!, $oid: GitObjectID!, $method: PullRequestMergeMethod!) {
            enablePullRequestAutoMerge(
              input: {pullRequestId: $id, expectedHeadOid: $oid, mergeMethod: $method}
            ) {
              pullRequest { autoMergeRequest { enabledAt } }
            }
          }
          """


          class RefusedError(Exception):
              """A forge call that failed or was refused."""


          class InvalidSettingError(Exception):
              """A setting outside its allowed values."""


          def settings(env):
              """The inputs of the workflow, each checked against an allow-list."""
              switch = env["TRAIN_SWITCH"]
              method = env["TRAIN_MERGE_METHOD"].upper()
              accept = env["TRAIN_ACCEPT_STATES"].upper().split()
              age = env["TRAIN_MIN_AGE_DAYS"]
              if switch not in ("on", "off"):
                  raise InvalidSettingError(f"switch is {switch!r}, not on or off")
              if method not in METHODS:
                  raise InvalidSettingError(f"merge_method is {method!r}, not one of {', '.join(METHODS)}")
              if any(state not in ACCEPTABLE for state in accept):
                  raise InvalidSettingError(f"accept_states holds {accept}, allowed: {', '.join(ACCEPTABLE)}")
              if not age.isdigit() or int(age) > 30:
                  raise InvalidSettingError(f"min_age_days is {age!r}, not a whole number from 0 to 30")
              if not env.get("TRAIN_APP_CLIENT_ID", "").strip():
                  raise InvalidSettingError("app_client_id is empty")
              if "PRIVATE KEY-----" not in env.get("TRAIN_APP_KEY", ""):
                  raise InvalidSettingError(
                      "the app key is empty or no PEM key: the caller passes no secret, "
                      "or the job runs outside the environment that holds it"
                  )
              return {
                  "switch": switch,
                  "method": method,
                  "accept": frozenset(("CLEAN", *accept)),
                  "min_age": timedelta(days=int(age)),
                  "hold": frozenset(name for name in env["TRAIN_HOLD_LABELS"].split(",") if name),
                  "dependency": tuple(env["TRAIN_DEPENDENCY_BRANCHES"].split()),
                  "person": tuple(env["TRAIN_PERSON_BRANCHES"].split()),
                  "security": frozenset(name for name in env["TRAIN_SECURITY_LABELS"].split(",") if name),
                  "client_id": env["TRAIN_APP_CLIENT_ID"].strip(),
              }


          def call(url, token, method="POST", body=None):
              """One request to the forge; the parsed answer, or RefusedError with what it said."""
              data = None if body is None else json.dumps(body).encode()
              request = urllib.request.Request(url, data=data, method=method)
              request.add_header("Authorization", f"Bearer {token}")
              request.add_header("Accept", "application/vnd.github+json")
              request.add_header("X-GitHub-Api-Version", "2022-11-28")
              try:
                  with urllib.request.urlopen(request, timeout=TIMEOUT) as answer:
                      text = answer.read().decode()
              except urllib.error.HTTPError as err:
                  raise RefusedError(f"{method} {url}: HTTP {err.code} {err.read().decode()[:500]}") from err
              except (urllib.error.URLError, TimeoutError) as err:
                  raise RefusedError(f"{method} {url}: {err}") from err
              return json.loads(text) if text else {}


          def graphql(env, query, variables):
              answer = call(
                  env["GITHUB_GRAPHQL_URL"],
                  env["TRAIN_TOKEN"],
                  body={
                      "query": query,
                      "variables": variables,
                  },
              )
              if answer.get("errors") or "data" not in answer:
                  raise RefusedError(f"GraphQL: {json.dumps(answer.get('errors'))[:500]}")
              return answer["data"]


          def fetch(env):
              """The repository and its open pull requests, re-read while a merge state is UNKNOWN."""
              owner, name = env["GITHUB_REPOSITORY"].split("/", 1)
              repo = {}
              for attempt in range(SETTLE_ROUNDS):
                  repo = graphql(env, QUERY, {"owner": owner, "name": name})["repository"]
                  pulls = repo["pullRequests"]["nodes"]
                  if all(pull["mergeStateStatus"] != "UNKNOWN" or pull["isDraft"] for pull in pulls):
                      break
                  if attempt + 1 < SETTLE_ROUNDS:
                      time.sleep(SETTLE_SECONDS)
              return repo


          def update_made(pull):
              """Commit time of the oldest commit of the last 20 that is no merge, or None.

              The update bot rewrites its branch for every new version, so its commit is
              the oldest one; a repin pushed on top, or a merge from the default branch,
              does not restart the wait. With more commits than are read, a younger one
              stands in, which only lengthens the wait.
              """
              times = [
                  node["commit"]["committedDate"]
                  for node in pull["history"]["nodes"]
                  if node["commit"]["parents"]["totalCount"] == 1
              ]
              return datetime.fromisoformat(min(times)) if times else None


          def is_red(pull):
              nodes = pull["latest"]["nodes"]
              suites = nodes[-1]["commit"]["checkSuites"]["nodes"] if nodes else []
              return any(suite["conclusion"] in RED for suite in suites)


          def too_young(pull, labels, conf, now):
              """Why a dependency update waits for its minimum age, or None."""
              if not pull["headRefName"].startswith(conf["dependency"]):
                  return None
              if labels & conf["security"] or "[SECURITY]" in pull["title"]:
                  return None
              changed = update_made(pull)
              if changed is None:
                  return "dependency update with no commit of its own to date"
              if now - changed < conf["min_age"]:
                  return f"dependency update made {changed:%Y-%m-%d %H:%M}Z, younger than the minimum age"
              return None


          def verdict(pull, repo, conf, now):
              """land, behind, or the reason the train leaves the pull request alone."""
              labels = frozenset(label["name"] for label in pull["labels"]["nodes"])
              state = pull["mergeStateStatus"]
              held = sorted(labels & conf["hold"])
              if pull["baseRefName"] != repo["defaultBranchRef"]["name"]:
                  return "not for the default branch"
              if pull["isDraft"]:
                  return "draft"
              if pull["isCrossRepository"]:
                  return "from another repository: a person lands it"
              if held:
                  return f"labelled {held[0]}"
              if conf["person"] and pull["headRefName"].startswith(conf["person"]):
                  return "release or reserved branch: a person lands it"
              young = too_young(pull, labels, conf, now)
              if young:
                  return young
              if state in conf["accept"]:
                  return "land"
              if state == "BEHIND":
                  return "red" if is_red(pull) else "behind"
              return f"merge state {state}"


          def in_flight(pull, reason):
              """An armed pull request that can still land holds the train."""
              waiting = reason in ("behind", "merge state BLOCKED")
              return bool(pull["autoMergeRequest"]) and waiting and not is_red(pull)


          def land(env, conf, pull):
              data = graphql(
                  env,
                  MERGE,
                  {
                      "id": pull["id"],
                      "oid": pull["headRefOid"],
                      "method": conf["method"],
                  },
              )
              if not data["mergePullRequest"]["pullRequest"]["merged"]:
                  raise RefusedError(f"#{pull['number']}: the forge did not report it merged")


          def arm(env, conf, pull):
              data = graphql(
                  env, ARM, {"id": pull["id"], "oid": pull["headRefOid"], "method": conf["method"]}
              )
              if not data["enablePullRequestAutoMerge"]["pullRequest"]["autoMergeRequest"]:
                  raise RefusedError(f"#{pull['number']}: the forge returned no auto-merge request")


          def update(env, pull):
              """Merge the default branch into the head branch; False when it conflicts."""
              url = f"{env['GITHUB_API_URL']}/repos/{env['GITHUB_REPOSITORY']}/pulls/{pull['number']}"
              try:
                  call(
                      f"{url}/update-branch",
                      env["TRAIN_TOKEN"],
                      "PUT",
                      {
                          "expected_head_sha": pull["headRefOid"],
                      },
                  )
              except RefusedError as err:
                  if NO_NEW_COMMITS in str(err):
                      return True
                  if CONFLICT in str(err):
                      return False
                  raise
              return True


          def advance(env, conf, repo, rows, notes):
              """Arm and update the oldest BEHIND pull request that is not red."""
              for pull, reason in rows:
                  if reason != "behind":
                      continue
                  if repo["autoMergeAllowed"] and not pull["autoMergeRequest"]:
                      arm(env, conf, pull)
                      notes[pull["number"]] = "armed, updated from the default branch"
                  else:
                      notes[pull["number"]] = "updated from the default branch"
                  if update(env, pull):
                      return
                  notes[pull["number"]] = "conflicts with the default branch"


          def run(env, conf, repo, now):
              pulls = repo["pullRequests"]["nodes"]
              rows = [(pull, verdict(pull, repo, conf, now)) for pull in pulls]
              notes = {pull["number"]: reason for pull, reason in rows}
              if conf["switch"] == "off":
                  return rows, notes, "switched off: nothing landed or updated"
              for pull, reason in rows:
                  if reason == "land":
                      land(env, conf, pull)
                      notes[pull["number"]] = "landed"
                      return rows, notes, f"landed #{pull['number']}"
              holding = [pull["number"] for pull, reason in rows if in_flight(pull, reason)]
              if holding:
                  return rows, notes, f"#{holding[0]} is armed and in flight"
              advance(env, conf, repo, rows, notes)
              return rows, notes, "no pull request at a mergeable state"


          def report(name, repo, rows, notes, outcome):
              """The section of one repository with open pull requests."""
              lines = [
                  f"### {name}: {outcome}",
                  "",
                  "| Pull request | Merge state | Train |",
                  "|---|---|---|",
              ]
              lines += [
                  f"| #{pull['number']} | {pull['mergeStateStatus']} | {notes[pull['number']]} |"
                  for pull, _ in rows
              ]
              if repo["pullRequests"]["pageInfo"]["hasNextPage"]:
                  lines.append("\nOnly the 100 oldest open pull requests were read.")
              return "\n".join(lines) + "\n"


          def b64url(data):
              return base64.urlsafe_b64encode(data).rstrip(b"=").decode()


          def app_jwt(env, conf):
              """A JWT of the app, signed RS256 by openssl; the key goes through a pipe, never a file."""
              openssl = shutil.which("openssl")
              if not openssl:
                  raise RefusedError("openssl is not on the runner: the app's JWT cannot be signed")
              now = int(time.time())
              claims = {"iat": now - 60, "exp": now + JWT_SECONDS, "iss": conf["client_id"]}
              head = b64url(json.dumps({"alg": "RS256", "typ": "JWT"}).encode())
              signing_input = f"{head}.{b64url(json.dumps(claims).encode())}"
              read_end, write_end = os.pipe()
              with os.fdopen(write_end, "w") as pipe:
                  pipe.write(env["TRAIN_APP_KEY"])
              try:
                  done = subprocess.run(
                      [openssl, "dgst", "-sha256", "-sign", f"/dev/fd/{read_end}"],
                      input=signing_input.encode(),
                      capture_output=True,
                      pass_fds=(read_end,),
                      timeout=TIMEOUT,
                      check=False,
                  )
              finally:
                  os.close(read_end)
              if done.returncode != 0 or not done.stdout:
                  raise RefusedError(f"openssl could not sign the app's JWT (exit {done.returncode})")
              return f"{signing_input}.{b64url(done.stdout)}"


          def pages(env, token, path, key=None):
              """Every item of a paginated list, at most MAX_PAGES pages of 100."""
              items = []
              for page in range(1, MAX_PAGES + 1):
                  answer = call(f"{env['GITHUB_API_URL']}{path}?per_page=100&page={page}", token, "GET")
                  batch = answer[key] if key else answer
                  items += batch
                  if len(batch) < 100:
                      return items
              raise RefusedError(f"GET {path}: more than {MAX_PAGES * 100} entries")


          def mint(env, conf, installation, rights, repositories=None):
              """An installation token with exactly these rights, for these repositories only."""
              body = {"permissions": rights}
              if repositories is not None:
                  body["repositories"] = repositories
              url = f"{env['GITHUB_API_URL']}/app/installations/{installation['id']}/access_tokens"
              return call(url, app_jwt(env, conf), "POST", body)["token"]


          def revoke(env, token):
              call(f"{env['GITHUB_API_URL']}/installation/token", token, "DELETE")


          def repositories(env, conf, installation):
              """The installation's repositories the train serves, read with a read-only token."""
              token = mint(env, conf, installation, LIST_RIGHTS)
              try:
                  listed = pages(env, token, "/installation/repositories", "repositories")
              finally:
                  revoke(env, token)
              return [r for r in listed if not r.get("archived") and not r.get("disabled")]


          def one(env, conf, installation, target, now):
              """The train in one repository, with a token for that repository alone."""
              rights = WRITE_RIGHTS if conf["switch"] == "on" else READ_RIGHTS
              token = mint(env, conf, installation, rights, [target["name"]])
              local = {**env, "GITHUB_REPOSITORY": target["full_name"], "TRAIN_TOKEN": token}
              try:
                  repo = fetch(local)
                  rows, notes, outcome = run(local, conf, repo, now)
              finally:
                  revoke(env, token)
              moved = any(note.startswith(("armed", "updated")) for note in notes.values())
              section = report(target["full_name"], repo, rows, notes, outcome) if rows else ""
              return outcome, section, moved, bool(repo["releaseConfig"] and repo["releaseManifest"])


          def sweep(env, conf, started):
              """Run the train in every repository; the per-account tally, the sections, the refusals."""
              accounts, sections, refusals, skipped, releases = {}, [], [], [], []
              for installation in pages(env, app_jwt(env, conf), "/app/installations"):
                  account = installation["account"]["login"]
                  if installation.get("suspended_at"):
                      accounts[account] = "suspended"
                      continue
                  try:
                      targets = repositories(env, conf, installation)
                  except RefusedError as err:
                      refusals.append(f"{account}: {err}")
                      accounts[account] = "refused"
                      continue
                  tally = {"repositories": 0, "landed": 0, "updated": 0, "refused": 0}
                  accounts[account] = tally
                  for target in targets:
                      if time.monotonic() - started > SWEEP_SECONDS:
                          skipped.append(target["full_name"])
                          continue
                      tally["repositories"] += 1
                      try:
                          now = datetime.now(UTC)
                          outcome, section, moved, release = one(env, conf, installation, target, now)
                      except RefusedError as err:
                          tally["refused"] += 1
                          refusals.append(f"{target['full_name']}: {err}")
                          continue
                      tally["landed"] += outcome.startswith("landed")
                      tally["updated"] += moved
                      sections.append(section)
                      if release:
                          releases.append({"owner": account, "name": target["name"]})
              return accounts, [s for s in sections if s], refusals, skipped, releases


          def append(path, text):
              with open(path, "a", encoding="utf-8") as handle:
                  handle.write(text)


          def summary(env, accounts, sections, refusals, skipped, releases):
              lines = [
                  "## Merge train sweep",
                  "",
                  "| Account | Repositories | Landed | Updated | Refused |",
                  "|---|---|---|---|---|",
              ]
              for account, tally in sorted(accounts.items(), key=lambda item: item[0].lower()):
                  if isinstance(tally, str):
                      lines.append(f"| {account} | {tally} | | | |")
                  else:
                      lines.append(
                          f"| {account} | {tally['repositories']} | {tally['landed']} "
                          f"| {tally['updated']} | {tally['refused']} |"
                      )
              if refusals:
                  lines += ["", "Refused:", ""] + [f"- {line}" for line in refusals]
              if skipped:
                  lines += ["", f"Not reached within {SWEEP_SECONDS} s: {', '.join(skipped)}"]
              if len(releases) > MAX_RELEASES:
                  late = ", ".join(f"{r['owner']}/{r['name']}" for r in releases[MAX_RELEASES:])
                  lines += ["", f"No release run, the job matrix holds {MAX_RELEASES}: {late}"]
                  del releases[MAX_RELEASES:]
              named = ", ".join(f"{r['owner']}/{r['name']}" for r in releases) or "none"
              lines += ["", f"Release pull requests and releases next: {named}"]
              text = "\n".join([*lines, "", *sections]) + "\n"
              sys.stdout.write(text)
              append(env["GITHUB_STEP_SUMMARY"], text)
              append(env["GITHUB_OUTPUT"], f"releases={json.dumps(releases, separators=(',', ':'))}\n")


          def main(env):
              try:
                  conf = settings(env)
              except InvalidSettingError as err:
                  sys.stdout.write(f"::error title=Merge train setting::{err}\n")
                  return 3
              try:
                  accounts, sections, refusals, skipped, releases = sweep(env, conf, time.monotonic())
              except RefusedError as err:
                  sys.stdout.write(f"::error title=Merge train refused::{err}\n")
                  return 1
              summary(env, accounts, sections, refusals, skipped, releases)
              for line in refusals:
                  sys.stdout.write(f"::error title=Merge train refused::{line}\n")
              if skipped:
                  sys.stdout.write(f"::warning title=Merge train::{len(skipped)} repositories not reached\n")
              return 1 if refusals else 0


          sys.exit(main(os.environ))

  release:
    # release-please in every repository the sweep found with
    # release-please-config.json and .release-please-manifest.json on its
    # default branch, with a token of the app limited to that repository. Events
    # the app's token causes start workflow runs, so the release pull request
    # gets its required checks and a release starts the repository's
    # `release: published` workflows; with GITHUB_TOKEN neither happens.
    name: Release pull request and release
    needs: train
    if: >-
      ${{ !cancelled() && inputs.switch == 'on'
      && needs.train.outputs.releases != '' && needs.train.outputs.releases != '[]' }}
    runs-on: ${{ inputs.runner }}
    environment: merge-train
    timeout-minutes: 15
    permissions: {}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        repository: ${{ fromJSON(needs.train.outputs.releases) }}
    steps:
      - name: Mint a token for this repository alone
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ matrix.repository.owner }}
          repositories: ${{ matrix.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Open or update the release pull request, create the release of a merged one
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}
          repo-url: ${{ matrix.repository.owner }}/${{ matrix.repository.name }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
