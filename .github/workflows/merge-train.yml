---
# Merge train (reusable): one sweep over every repository the merge-train
# app is installed on, landing pull requests one at a time without a session
# or a person driving it (decision record 0029). In each repository a run does
# at most one write:
#
# - It lands the oldest pull request the forge reports CLEAN (or a state the
#   caller accepts in `accept_states`), through the merge mutation with the
#   head commit it read. The forge refuses that merge when a required check or
#   rule fails, and the app has no bypass, so nothing red lands.
# - When none is CLEAN and no armed pull request is still in flight, it arms
#   auto-merge on the oldest BEHIND pull request whose checks are not red (each
#   workflow judged by its newest run; decision record 0042), and
#   merges the default branch into its head (update-branch, never a rebase:
#   a forge rebase re-commits the head unsigned). The forge offers auto-merge
#   only while a pull request cannot merge at once, so BEHIND is where arming
#   happens; a CLEAN pull request is landed directly.
# - It updates only a pull request that is armed or that it arms: where the
#   repository allows no auto-merge, an unarmed BEHIND pull request stays as it
#   is. Where a ruleset on the default branch demands linear history, or the
#   rules cannot be read, it updates nothing and reports BEHIND: a merge
#   commit would break that rule (decision record 0044).
# - When nothing lands and no armed pull request is in flight, a red pull
#   request whose red runs failed only at the step "Stop on a draft pull
#   request" gets the label `merge-train: refresh` added and removed: a run
#   started before "ready for review" replays the draft payload on a re-run,
#   while the label events carry the current one (decision record 0041). Once
#   per failed run; workflows without labeled or unlabeled triggers stay red,
#   and the summary says a person pushes.
# - In flight means armed with checks still running (BLOCKED). An armed pull
#   request that is BEHIND cannot land until the default branch is merged into
#   it, so it holds nothing: the sweep updates it first, before it arms another.
# - A merge the forge answers with "Merge already in progress" is in flight,
#   not refused: the next run reads the pull request again.
# - When squashing, the train writes the squash commit message from the pull
#   request's own non-merge commits and their sign-offs (decision record 0037),
#   without Co-authored-by trailers.
# - Order: a security update (a label in `security_labels`, or "[SECURITY]"
#   in the title in any letter case, as Renovate writes it) goes before every other pull request
#   in each of these steps, then the oldest first. The one generated-files
#   write per run goes to the dependency update whose head has waited longest,
#   so an update re-pushed on every default-branch push cannot keep the write
#   from one never served (decision record 0060).
# - Security hold: while a security update the train serves is open, every
#   other dependency update to the default branch is turned into a draft and
#   labelled "merge-train: security hold", so neither the forge's auto-merge
#   nor the update bot's own merge moves the default branch ahead of the fix.
#   Once no such security update is open, the train marks the held pull
#   requests ready again and removes the label. A held pull request a person
#   marks ready keeps the label and is not held again (decision record 0062).
# - After that write, it closes the open issues that the pull requests it
#   merged in the last 7 days name as closed (`Closes #N` and the forge's
#   other closing forms): the forge leaves them open when the app merges, and
#   that holds for auto-merges the forge carries out for the app too
#   (decision record 0039). Same repository only; an issue reopened after the
#   merge stays open.
#
# Left alone: drafts, superseded pull requests (label `superseded`, a body
# that says "Superseded by #N", or another open pull request whose body says
# "Supersedes #N"; decision record 0038), pull requests from forks, a base
# other than the default branch, the labels in `hold_labels`, heads in
# `person_branches` (release pull requests by default: a release is a
# person's act), dependency updates younger than `min_age_days` (3 days,
# the fleet's minimum age: age counts from the pull request's opening; a
# rebase or a new version pushed onto an open update does not restart it;
# a security label or "[SECURITY]" in the title, in any letter case, skips
# the wait), and
# archived repositories. A repository leaves the train when the app is
# uninstalled from it.
#
# RELEASES. A repository with release-please-config.json and
# .release-please-manifest.json on its default branch gets a second job after
# the sweep (decision records 0031, 0040): release-please with a token of the
# app limited to that repository, contents, pull requests and workflows write.
# The job splits release creation and release pull request updates into separate
# steps: a repository that writes its own release skips release creation and has
# its labels moved once the tag is on the merge commit, while a pre-existing
# release is verified. The train never merges: heads in `person_branches` stay
# untouched, so a release stays a person's act. The app's events start workflow
# runs, so the release pull request gets its required checks and the release
# starts the repository's `release: published` workflows. `switch: off` runs no
# release job. A repository listed in `release_off` gets no release job even
# when both release files are present (decision record 0045). A release head or
# a pull request with an `autorelease:` label is never updated by the sweep, and
# an open release pull request with a hold label or a release label other than
# `autorelease: pending` is not updated by the release job (decision record
# 0049). At most 3 release
# jobs run at once (`release_max_parallel`, a whole number from 1 to 3, default 3).
#
# CREDENTIAL. One repository holds the app's private key, as the secret
# MERGE_TRAIN_APP_KEY of its environment `merge-train`; the environment lets
# only the default branch deploy, so a workflow edited on another branch never
# reads the key. The job runs in that environment and the caller passes the
# secret as `app_private_key` and the client id as `app_client_id`. The key
# signs a JWT of the app (openssl, the key through a pipe, never a file).
# For every repository the job mints a token limited to that repository, with
# contents, pull requests and workflows write, checks and actions read (read
# rights only when `switch` is off), and revokes it when the repository is done.
# Only when an issue is to be closed, a second token for that repository
# carries issues write alone, for the comment and the close.
# Workflows write is there because the forge refuses a merge or an
# update-branch that changes a file under .github/workflows without it: pin
# updates do, and so does an update after the default branch changed a
# workflow. Events GITHUB_TOKEN causes start no workflow run, so a head it
# updated would never get its checks. GITHUB_TOKEN gets no permission at all.
#
# A refusal in one repository is reported and the sweep goes on; the run ends
# red when any repository refused. Repositories not reached within 25 minutes
# are named in the summary.
name: Merge train

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Label of the runner the job runs on. It needs python3 and the openssl
          command; there is no default, so the caller names its own runner.
        type: string
        required: true
      app_client_id:
        description: Client id of the merge-train app.
        type: string
        required: true
      switch:
        description: on lands and updates; off only reports.
        type: string
        required: false
        default: "on"
      merge_method:
        description: SQUASH or MERGE. A forge rebase is refused (unsigned commits).
        type: string
        required: false
        default: SQUASH
      accept_states:
        description: >-
          Merge states landed besides CLEAN, separated by spaces: UNSTABLE,
          HAS_HOOKS. Only for a repository that declares them acceptable.
        type: string
        required: false
        default: ""
      min_age_days:
        description: Minimum age of a dependency update, whole days from 0 to 30.
        type: string
        required: false
        default: "3"
      hold_labels:
        description: Labels that keep a pull request out of the train, comma-separated.
        type: string
        required: false
        default: hold,do-not-merge,planted
      dependency_branches:
        description: Head prefixes of dependency updates, separated by spaces.
        type: string
        required: false
        default: renovate/ dependabot/
      person_branches:
        description: Head prefixes only a person lands, separated by spaces.
        type: string
        required: false
        default: release-please--
      release_max_parallel:
        description: Release jobs that run at once, a whole number from 1 to 3.
        type: number
        required: false
        default: 3
      release_off:
        description: >-
          Repositories, owner/name separated by spaces, where the train opens
          and pushes no release pull request.
        type: string
        required: false
        default: ""
      security_labels:
        description: Labels that exempt a dependency update from the minimum age, comma-separated.
        type: string
        required: false
        default: security
    secrets:
      app_private_key:
        description: >-
          Private key of the merge-train app, the secret of the environment
          merge-train of the calling repository.
        required: true

permissions: {}

jobs:
  train:
    name: Merge train
    runs-on: ${{ inputs.runner }}
    environment: merge-train
    timeout-minutes: 30
    permissions: {}
    outputs:
      releases: ${{ steps.sweep.outputs.releases }}
    steps:
      # The train's pure rules (which pull request it lands, updates or leaves
      # alone, which issues it closes, and the squash message) and its GraphQL
      # documents, written as a module the train script imports. They stayed
      # inline when the sweep moved to tools/merge_train.py, since this run
      # script is within the engine's cap of 4096 fields per run script
      # (decision records 0034, 0037, 0039, 0053).
      - name: Write the train rules module
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/train_rules.py" <<'PY'
          """Merge train rules: verdicts, issues to close, squash message, GraphQL documents."""

          import re
          from datetime import datetime

          RED = ("FAILURE", "TIMED_OUT", "CANCELLED", "ACTION_REQUIRED", "STARTUP_FAILURE")
          SUPERSEDES = re.compile(
              r"\bsupersedes\s+(#\d+(?:(?:\s*,\s*|\s*,?\s*and\s+|\s+)#\d+)*)", re.I
          )
          SUPERSEDED_BY = re.compile(r"\bsuperseded\s+by\s+#\d+", re.I)
          DRAFT_STEP = "Stop on a draft pull request"
          REFRESH_LABEL = "merge-train: refresh"
          SECURITY_HOLD_LABEL = "merge-train: security hold"
          RELEASE_HEAD = "release-please--"
          RELEASE_LABEL = "autorelease:"
          REFRESH_LIMIT = 3
          STILL_STOPPED = "stopped at the draft step, a refresh started no run: a person pushes"


          def suite_key(suite):
              """Key grouping check suites of the same workflow or app."""
              run = suite.get("workflowRun")
              if run and run.get("workflow"):
                  return ("workflow", run["workflow"]["databaseId"])
              app = suite.get("app") or {}
              return ("app", app.get("slug") or "")


          def suite_rank(suite):
              """Creation time, then id: the later of two suites of one key ranks higher."""
              return (suite.get("createdAt") or "", suite.get("databaseId") or 0)


          def newest_suites(suites):
              """Per key the suite with the greatest (createdAt, databaseId)."""
              newest = {}
              for suite in suites:
                  key = suite_key(suite)
                  if key not in newest or suite_rank(suite) > suite_rank(newest[key]):
                      newest[key] = suite
              return newest


          def is_red(pull):
              """Each workflow judged by its newest run on the head commit.

              A run a newer run of the same workflow cancelled is not red; decision
              record 0042.
              """
              nodes = pull["latest"]["nodes"]
              suites = nodes[-1]["commit"]["checkSuites"]["nodes"] if nodes else []
              return any(suite["conclusion"] in RED for suite in newest_suites(suites).values())


          def is_security(pull, conf):
              """A security update: a security label, or "[SECURITY]" in the title in any letter case."""
              labels = frozenset(label["name"] for label in pull["labels"]["nodes"])
              return bool(labels & conf["security"]) or "[security]" in pull["title"].casefold()


          def head_since(pull):
              """When the head commit was made, or the pull request's opening where the query has none."""
              nodes = pull["latest"]["nodes"]
              when = nodes[-1]["commit"].get("committedDate") if nodes else None
              return datetime.fromisoformat(when or pull["createdAt"])


          def serving_order(rows, conf):
              """Rows in the order the train serves them: security updates first, then oldest first.

              The sort is stable, so within each group the query's oldest-first order stays.
              """
              return sorted(rows, key=lambda row: not is_security(row[0], conf))


          def label_names(pull):
              """The names of a pull request's labels."""
              return frozenset(label["name"] for label in pull["labels"]["nodes"])


          def security_hold(rows, default_branch, conf):
              """(open security update or None, pull requests to hold, pull requests to release).

              While the train serves a security update, a dependency update merged by the
              forge's auto-merge or the update bot moves the default branch and leaves the
              fix behind (decision record 0062). A draft cannot be merged by either.
              """
              served = ("land", "behind", "red")
              fixes = [
                  pull
                  for pull, reason in rows
                  if is_security(pull, conf) and (reason in served or reason.startswith("merge state"))
              ]
              marked = [pull for pull, _ in rows if SECURITY_HOLD_LABEL in label_names(pull)]
              if not fixes:
                  return None, [], marked
              hold = [
                  pull
                  for pull, _ in rows
                  if pull["headRefName"].startswith(conf["dependency"])
                  and not is_security(pull, conf)
                  and not pull["isDraft"]
                  and not pull["isCrossRepository"]
                  and pull["baseRefName"] == default_branch
                  and SECURITY_HOLD_LABEL not in label_names(pull)
              ]
              return fixes[0], hold, []


          def too_young(pull, labels, conf, now):
              """Why a dependency update waits for its minimum age, or None.

              Age counts from the pull request's opening; a rebase or a new version pushed
              onto an open update does not restart it.
              """
              if not pull["headRefName"].startswith(conf["dependency"]):
                  return None
              if is_security(pull, conf):
                  return None
              created = datetime.fromisoformat(pull["createdAt"])
              if now - created < conf["min_age"]:
                  return f"dependency update opened {created:%Y-%m-%d %H:%M}Z, younger than the minimum age"
              return None


          def superseded(pulls):
              """Numbers of open pull requests another open one supersedes, or that say so themselves."""
              found = set()
              for pull in pulls:
                  body = pull.get("body") or ""
                  for listed in SUPERSEDES.findall(body):
                      found.update(int(number) for number in re.findall(r"#(\d+)", listed))
                  if SUPERSEDED_BY.search(body):
                      found.add(pull["number"])
              return frozenset(found)


          def verdict(pull, repo, conf, now, replaced=frozenset()):
              """land, behind, or the reason the train leaves the pull request alone."""
              labels = frozenset(label["name"] for label in pull["labels"]["nodes"])
              state = pull["mergeStateStatus"]
              held = sorted(labels & conf["hold"])
              if pull["baseRefName"] != repo["defaultBranchRef"]["name"]:
                  return "not for the default branch"
              if pull["isDraft"]:
                  return "draft"
              if "superseded" in labels or pull["number"] in replaced:
                  return "superseded: a person closes it"
              if pull.get("isInMergeQueue"):
                  return "in the merge queue"
              if pull["isCrossRepository"]:
                  return "from another repository: a person lands it"
              if held:
                  return f"labelled {held[0]}"
              release = pull["headRefName"].startswith(RELEASE_HEAD)
              release = release or any(name.startswith(RELEASE_LABEL) for name in labels)
              if release or (conf["person"] and pull["headRefName"].startswith(conf["person"])):
                  return "release or reserved branch: a person lands it"
              young = too_young(pull, labels, conf, now)
              if young:
                  return young
              if state in conf["accept"]:
                  return "land"
              if state == "BEHIND":
                  return "red" if is_red(pull) else "behind"
              return f"merge state {state}"


          def linear_history(repo):
              """Whether the default branch takes no merge commit; True when its rules are unread."""
              rules = (repo["defaultBranchRef"] or {}).get("rules")
              if not rules or rules.get("nodes") is None:
                  return True
              return any(rule["type"] == "REQUIRED_LINEAR_HISTORY" for rule in rules["nodes"])


          def updatable(repo, rows, notes, conf):
              """BEHIND pull requests the train may update, armed ones first, each with whether to arm it.

              A security update goes before every other; within each group an armed pull
              request goes first: it already waits for the forge to merge it.
              Only an armed pull request is updated, and none where the default branch
              demands linear history (decision record 0044); `notes` says why one is skipped.
              """
              behind = [pull for pull, reason in rows if reason == "behind"]
              if linear_history(repo):
                  for pull in behind:
                      notes[pull["number"]] = "behind: linear history, a person rebases"
                  return []
              behind.sort(key=lambda pull: (not is_security(pull, conf), not pull["autoMergeRequest"]))
              picked = []
              for pull in behind:
                  if pull["autoMergeRequest"] or repo["autoMergeAllowed"]:
                      picked.append((pull, not pull["autoMergeRequest"]))
                  else:
                      notes[pull["number"]] = "behind: auto-merge off, not armed, not updated"
              return picked


          def in_flight(pull, reason):
              """An armed pull request whose checks still run holds the train.

              An armed BEHIND pull request does not: it cannot land before it is updated.
              """
              armed = bool(pull["autoMergeRequest"])
              return armed and reason == "merge state BLOCKED" and not is_red(pull)


          def red_runs(pull):
              """(run id, creation time) per workflow whose newest run on the head commit is red."""
              nodes = pull["latest"]["nodes"]
              suites = nodes[-1]["commit"]["checkSuites"]["nodes"] if nodes else []
              return [
                  ((suite["workflowRun"] or {}).get("databaseId"), suite["createdAt"])
                  for suite in newest_suites(suites).values()
                  if suite["conclusion"] in RED
              ]


          def refresh_candidates(rows):
              """Red pull requests a fresh event could unblock, oldest first, at most REFRESH_LIMIT."""
              waiting = ("red", "merge state BLOCKED", "merge state UNSTABLE")
              found = [pull for pull, reason in rows if reason in waiting and red_runs(pull)]
              return found[:REFRESH_LIMIT]


          def stopped_at_draft_step(jobs):
              """Whether the failed steps of a run's jobs are the draft step and nothing else."""
              failed = {
                  step["name"]
                  for job in jobs
                  for step in job.get("steps") or []
                  if step.get("conclusion") == "failure"
              }
              return failed == {DRAFT_STEP}


          def refreshed_since(pull, created):
              """Whether REFRESH_LABEL was removed at or after a run was created: no run followed it."""
              when = datetime.fromisoformat(created)
              return any(
                  event["label"]["name"] == REFRESH_LABEL
                  and datetime.fromisoformat(event["createdAt"]) >= when
                  for event in pull["refreshes"]["nodes"]
              )


          def refresh(rows, notes, jobs, toggle):
              """Give the oldest pull request whose red runs stopped at the draft step a fresh event.

              A re-run replays the draft payload; a label event carries the current one
              (decision record 0041). Once per failed run: a refresh that started no run
              is left to a person. jobs reads a run's jobs; toggle adds and removes REFRESH_LABEL.
              """
              for pull in refresh_candidates(rows):
                  runs = red_runs(pull)
                  if not all(run and stopped_at_draft_step(jobs(run)) for run, _ in runs):
                      continue
                  if refreshed_since(pull, max(created for _, created in runs)):
                      notes[pull["number"]] = STILL_STOPPED
                      continue
                  toggle(pull)
                  notes[pull["number"]] = "refreshed: its red runs stopped at the draft step"
                  return f"refreshed #{pull['number']}"
              return None


          def issues_to_close(merged, repository, bot, since):
              """(pull request, merge commit, issue) for each open issue a train merge should have closed.

              The forge leaves the issues a pull request closes open when the train merges it
              (decision record 0039). Only pull requests the app merged since `since`, only
              issues of the same repository, and never an issue reopened after the merge:
              reopening is a person's call.
              """
              found = []
              for pull in merged:
                  merged_at = datetime.fromisoformat(pull["mergedAt"])
                  if (pull["mergedBy"] or {}).get("login") != bot or merged_at < since:
                      continue
                  for issue in pull["closingIssuesReferences"]["nodes"]:
                      if issue["state"] != "OPEN" or issue["repository"]["nameWithOwner"] != repository:
                          continue
                      reopened = [
                          datetime.fromisoformat(event["createdAt"])
                          for event in issue["timelineItems"]["nodes"]
                      ]
                      if any(when > merged_at for when in reopened):
                          continue
                      found.append((pull["number"], pull["mergeCommit"]["oid"], issue["number"]))
              return found


          def clean_commit(message, sign_offs):
              """Subject and trailer-stripped body of one commit; appends new sign-offs."""
              subject, _, rest = message.partition("\n")
              kept = []
              for line in rest.splitlines():
                  text = line.strip()
                  low = text.lower()
                  if low.startswith("signed-off-by:") and text[14:].strip():
                      if text not in sign_offs:
                          sign_offs.append(text)
                  elif not low.startswith("co-authored-by:"):
                      kept.append(line)
              return subject.strip(), "\n".join(kept).strip()


          def squash_message(title, number, messages):
              """Headline and body of a squash merge from the non-merge commit messages."""
              entries, sign_offs = [], []
              for message in messages:
                  subject, body = clean_commit(message, sign_offs)
                  if len(messages) == 1:
                      entries.append(body)
                  else:
                      entries.append(f"* {subject}\n\n{body}" if body else f"* {subject}")
              if not sign_offs:
                  raise ValueError("no Signed-off-by on its commits")
              headline = f"{title} (#{number})"
              prefix = "\n\n".join(e for e in entries if e)
              full_body = f"{prefix}\n\n" + "\n".join(sign_offs) if prefix else "\n".join(sign_offs)
              lines = full_body.lower().splitlines()
              if any(line.strip().startswith("co-authored-by:") for line in lines):
                  raise ValueError("squash message holds a Co-authored-by line")
              return headline, full_body


          def check_release_off(raw, error_cls=ValueError):
              """Repositories opted out of release runs, lowercased frozenset of 'owner/name'."""
              repos = set()
              for item in raw.split():
                  parts = item.split("/")
                  if len(parts) != 2 or not parts[0] or not parts[1]:
                      raise error_cls(f"release_off entry {item!r} is not owner/name")
                  repos.add(item.lower())
              return frozenset(repos)


          MAX_RELEASE_PARALLEL = 3


          def check_release_parallel(raw, error_cls=ValueError):
              """Release jobs at once, a whole number from 1 to MAX_RELEASE_PARALLEL (HISS-06)."""
              if not raw.isdigit() or not 1 <= int(raw) <= MAX_RELEASE_PARALLEL:
                  raise error_cls(
                      f"release_max_parallel is {raw!r}, not a whole number from 1 to {MAX_RELEASE_PARALLEL}"
                  )
              return int(raw)


          QUERY = """
          query($owner: String!, $name: String!, $after: String) {
            repository(owner: $owner, name: $name) {
              defaultBranchRef { name rules(first: 50) { nodes { type } } }
              autoMergeAllowed
              mergeQueue { id }
              releaseConfig: object(expression: "HEAD:release-please-config.json") { oid }
              releaseManifest: object(expression: "HEAD:.release-please-manifest.json") { oid }
              pullRequests(states: OPEN, first: 25, after: $after,
                           orderBy: {field: CREATED_AT, direction: ASC}) {
                pageInfo { hasNextPage endCursor }
                nodes {
                  number id title body createdAt isDraft isCrossRepository baseRefName headRefName headRefOid
                  mergeStateStatus isInMergeQueue
                  autoMergeRequest { enabledAt }
                  labels(first: 50) { nodes { name } }
                  refreshes: timelineItems(itemTypes: [UNLABELED_EVENT], last: 5) {
                    nodes { ... on UnlabeledEvent { createdAt label { name } } }
                  }
                  latest: commits(last: 1) {
                    nodes {
                      commit {
                        committedDate
                        checkSuites(first: 30) {
                          nodes {
                            databaseId
                            conclusion
                            createdAt
                            app { slug }
                            workflowRun { databaseId workflow { databaseId } }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
          """
          COMMITS = """
          query($owner: String!, $name: String!, $number: Int!) {
            repository(owner: $owner, name: $name) {
              pullRequest(number: $number) {
                commits(first: 100) {
                  totalCount
                  nodes { commit { message parents { totalCount } } }
                }
              }
            }
          }
          """
          # The newest merged pull requests and the issues each one closes, for the close step.
          MERGED = """
          query($owner: String!, $name: String!) {
            repository(owner: $owner, name: $name) {
              pullRequests(states: MERGED, first: 10, orderBy: {field: UPDATED_AT, direction: DESC}) {
                nodes {
                  number mergedAt
                  mergedBy { login }
                  mergeCommit { oid }
                  closingIssuesReferences(first: 25) {
                    nodes {
                      number state
                      repository { nameWithOwner }
                      timelineItems(itemTypes: [REOPENED_EVENT], last: 5) {
                        nodes { ... on ReopenedEvent { createdAt } }
                      }
                    }
                  }
                }
              }
            }
          }
          """
          MERGE = """
          mutation($id: ID!, $oid: GitObjectID!, $method: PullRequestMergeMethod!,
                   $headline: String, $body: String) {
            mergePullRequest(
              input: {pullRequestId: $id, expectedHeadOid: $oid, mergeMethod: $method,
                      commitHeadline: $headline, commitBody: $body}
            ) {
              pullRequest { merged }
            }
          }
          """
          # A default branch with a merge queue refuses a direct merge; the queue lands it.
          ENQUEUE = """
          mutation($id: ID!, $oid: GitObjectID!) {
            enqueuePullRequest(input: {pullRequestId: $id, expectedHeadOid: $oid}) {
              mergeQueueEntry { state }
            }
          }
          """
          ARM = """
          mutation($id: ID!, $oid: GitObjectID!, $method: PullRequestMergeMethod!,
                   $headline: String, $body: String) {
            enablePullRequestAutoMerge(
              input: {pullRequestId: $id, expectedHeadOid: $oid, mergeMethod: $method,
                      commitHeadline: $headline, commitBody: $body}
            ) {
              pullRequest { autoMergeRequest { enabledAt } }
            }
          }
          """
          DRAFT = """
          mutation($id: ID!) {
            convertPullRequestToDraft(input: {pullRequestId: $id}) {
              pullRequest { isDraft }
            }
          }
          """
          READY = """
          mutation($id: ID!) {
            markPullRequestReadyForReview(input: {pullRequestId: $id}) {
              pullRequest { isDraft }
            }
          }
          """
          COMMIT_MUTATION = """
          mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) {
              commit { oid }
            }
          }
          """
          PY

      # The sweep script is tools/merge_train.py of this workflow's own commit,
      # not of the caller's repository: a caller pinned to a commit runs that
      # commit's script. Inline, the script would exceed the engine's cap of 4096
      # fields per run script. The job's token has no permission; the repository
      # is public, so the checkout needs none.
      - name: Check out the train script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: merge-train-source
          persist-credentials: false
          sparse-checkout: tools/merge_train.py
          sparse-checkout-cone-mode: false

      # Merge train of every repository the app is installed on.
      #
      # In each repository it lands one clean pull request, or updates the next one.
      #
      # The app's key signs a short-lived JWT (openssl, the key passed through a pipe
      # and never written to a file). With it the sweep lists the app's installations,
      # reads each installation's repositories with a read-only token, and mints for
      # every repository a token limited to that one repository; the train runs with
      # it, and the token is revoked at once. A refusal in one repository is recorded
      # and the sweep goes on with the next.
      #
      # Exit codes: 0 done, 1 a forge call failed or was refused, 3 a setting is invalid.
      - name: Land or update one pull request in every repository of the app
        id: sweep
        shell: bash
        env:
          TRAIN_APP_CLIENT_ID: ${{ inputs.app_client_id }}
          TRAIN_APP_KEY: ${{ secrets.app_private_key }}
          TRAIN_SWITCH: ${{ inputs.switch }}
          TRAIN_MERGE_METHOD: ${{ inputs.merge_method }}
          TRAIN_ACCEPT_STATES: ${{ inputs.accept_states }}
          TRAIN_MIN_AGE_DAYS: ${{ inputs.min_age_days }}
          TRAIN_HOLD_LABELS: ${{ inputs.hold_labels }}
          TRAIN_DEPENDENCY_BRANCHES: ${{ inputs.dependency_branches }}
          TRAIN_PERSON_BRANCHES: ${{ inputs.person_branches }}
          TRAIN_RELEASE_OFF: ${{ inputs.release_off }}
          TRAIN_RELEASE_MAX_PARALLEL: ${{ inputs.release_max_parallel }}
          TRAIN_SECURITY_LABELS: ${{ inputs.security_labels }}
        run: python3 "$GITHUB_WORKSPACE/merge-train-source/tools/merge_train.py"

  release:
    # release-please in every repository the sweep found with
    # release-please-config.json and .release-please-manifest.json on its
    # default branch, with a token of the app limited to that repository. Events
    # the app's token causes start workflow runs, so the release pull request
    # gets its required checks and a release starts the repository's
    # `release: published` workflows; with GITHUB_TOKEN neither happens.
    #
    # The job splits release creation and release pull request updates into
    # separate steps (decision records 0031, 0040): repositories that write
    # their own releases (or run release-please themselves, treated as
    # skip-github-release) skip release creation and have their labels moved
    # once the tag is on the merge commit, while a pre-existing release is
    # verified and accepted if already complete.
    name: Release pull request and release
    needs: train
    if: >-
      ${{ !cancelled() && inputs.switch == 'on'
      && needs.train.outputs.releases != '' && needs.train.outputs.releases != '[]' }}
    runs-on: ${{ inputs.runner }}
    environment: merge-train
    timeout-minutes: 15
    permissions: {}
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.release_max_parallel }}
      matrix:
        repository: ${{ fromJSON(needs.train.outputs.releases) }}
    steps:
      - name: Mint a token for this repository alone
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ matrix.repository.owner }}
          repositories: ${{ matrix.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Write the release labels module
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release_labels.py" <<'PY'
          """Release settings and label handling for release-please."""

          import base64
          import http.client
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          PENDING_LABEL = "autorelease: pending"
          TAGGED_LABEL = "autorelease: tagged"
          RELEASE_HEAD = "release-please--"
          RELEASE_LABEL = "autorelease:"
          TIMEOUT = 30
          MAX_BYTES = 1024 * 1024
          READ_ATTEMPTS = 3
          READ_BACKOFF = 1
          OWN_RELEASE_ACTION = re.compile(r"^-?\s*uses:\s*[\"']?googleapis/release-please-action@")
          # Only the fields the release checks read: the REST pull list carries two full repository
          # objects per pull, about 480 kB for 20 pulls, and the forge cut that body short in 3 of 10
          # reads. The order is that of the REST list: newest created first.
          PULLS_QUERY = """
          query($owner: String!, $name: String!) {
            repository(owner: $owner, name: $name) {
              closed: pullRequests(
                states: [CLOSED, MERGED], first: 20, orderBy: {field: CREATED_AT, direction: DESC}
              ) { nodes { ...release } }
              open: pullRequests(
                states: [OPEN], first: 100, orderBy: {field: CREATED_AT, direction: DESC}
              ) { nodes { ...release } }
            }
          }
          fragment release on PullRequest {
            number state title mergedAt baseRefName headRefName
            mergeCommit { oid }
            labels(first: 100) { nodes { name } }
          }
          """


          class CallError(Exception):
              """A forge call failed or returned an error status; `status` is the HTTP code, if any."""

              def __init__(self, message, status=None):
                  super().__init__(message)
                  self.status = status


          def _read_once(req, method, url, status_only):
              """Execute one attempt of an HTTP request, decoding JSON or returning raw body."""
              try:
                  with urllib.request.urlopen(req, timeout=TIMEOUT) as resp:
                      raw = resp.read(MAX_BYTES + 1)
                      if len(raw) > MAX_BYTES:
                          raise CallError(f"{method} {url}: body exceeds {MAX_BYTES} bytes")
                      # read(amt) returns a body the peer closed early without an error; the length names it.
                      length = resp.headers.get("Content-Length")
                      if length and length.isdigit() and len(raw) != int(length):
                          raise http.client.IncompleteRead(raw, int(length) - len(raw))
                      if status_only:
                          return resp.status, raw
                      return resp.status, json.loads(raw.decode("utf-8")) if raw else {}
              except urllib.error.HTTPError as err:
                  if status_only:
                      return err.code, b""
                  raw = err.read(MAX_BYTES + 1)
                  detail = raw.decode("utf-8", errors="replace")[:200]
                  raise CallError(f"{method} {url}: HTTP {err.code}: {detail}", err.code) from err
              except (urllib.error.URLError, TimeoutError) as err:
                  raise CallError(f"{method} {url}: connection error: {err}") from err


          def call(url, token, method="GET", body=None, status_only=False, read_only=False):
              """Execute one HTTP request to the forge, with bounded read and timeout."""
              data = None if body is None else json.dumps(body).encode("utf-8")
              req = urllib.request.Request(url, data=data, method=method)
              if token:
                  req.add_header("Authorization", f"Bearer {token}")
              req.add_header("Accept", "application/vnd.github+json")
              req.add_header("X-GitHub-Api-Version", "2022-11-28")
              can_retry = (method == "GET" or read_only) and not status_only
              for attempt in range(1, READ_ATTEMPTS + 1):
                  try:
                      return _read_once(req, method, url, status_only)
                  except (json.JSONDecodeError, UnicodeDecodeError, http.client.IncompleteRead) as err:
                      what, detail = "invalid JSON response", str(err)
                      if isinstance(err, http.client.IncompleteRead):
                          whole = len(err.partial) + (err.expected or 0)
                          what, detail = "body cut", f"{len(err.partial)} of {whole} bytes read"
                      if not can_retry:
                          raise CallError(f"{method} {url}: {what}: {detail}") from err
                      if attempt < READ_ATTEMPTS:
                          time.sleep(READ_BACKOFF * attempt)
                          continue
                      raise CallError(
                          f"{method} {url}: {what} after {READ_ATTEMPTS} attempts: {detail}"
                      ) from err


          def read_config(api_url, repo, token):
              """Read and parse release-please-config.json via the contents API."""
              url = f"{api_url}/repos/{repo}/contents/release-please-config.json"
              _, data = call(url, token, method="GET")
              raw = data.get("content", "")
              try:
                  decoded = base64.b64decode(raw).decode("utf-8")
                  return json.loads(decoded)
              except ValueError as err:
                  raise CallError(f"parse release-please-config.json: {err}") from err


          def reads_own_release(api_url, repo, token):
              """The workflow file name running release-please in this repository, or False."""
              url = f"{api_url}/repos/{repo}/contents/.github/workflows"
              try:
                  _, entries = call(url, token, method="GET")
              except CallError as err:
                  if err.status == 404:
                      return False
                  raise
              if not isinstance(entries, list):
                  return False
              workflows = [
                  entry
                  for entry in entries
                  if isinstance(entry, dict)
                  and entry.get("type") == "file"
                  and isinstance(entry.get("name"), str)
                  and (entry["name"].endswith(".yml") or entry["name"].endswith(".yaml"))
              ][:100]
              for entry in workflows:
                  name = entry["name"]
                  file_url = entry.get("url") or f"{api_url}/repos/{repo}/contents/.github/workflows/{name}"
                  _, data = call(file_url, token, method="GET")
                  raw = data.get("content", "") if isinstance(data, dict) else ""
                  try:
                      content = base64.b64decode(raw).decode("utf-8")
                  except ValueError as err:
                      raise CallError(f"decode {name}: {err}") from err
                  for line in content.splitlines():
                      if OWN_RELEASE_ACTION.search(line.strip()):
                          return name
              return False


          def evaluate_skip(config):
              """Determine effective skip-github-release across packages."""
              top = config.get("skip-github-release", False)
              packages = config.get("packages")
              if not packages or not isinstance(packages, dict):
                  return bool(top)
              pkg_skips = {}
              for name, pkg in sorted(packages.items())[:100]:
                  val = pkg.get("skip-github-release", top) if isinstance(pkg, dict) else top
                  pkg_skips[name] = bool(val)
              values = set(pkg_skips.values())
              if len(values) > 1:
                  details = ", ".join(f"{k}={v}" for k, v in pkg_skips.items())
                  raise ValueError(f"mixed skip-github-release across packages: {details}")
              return next(iter(values))


          def package_settings(config, component):
              """The settings of the package a release branch names, over the top-level ones."""
              packages = config.get("packages") if isinstance(config.get("packages"), dict) else {}
              entries = [p for p in list(packages.values())[:100] if isinstance(p, dict)]
              named = [
                  p for p in entries if component and component in (p.get("component"), p.get("package-name"))
              ]
              package = named[0] if named else entries[0] if len(entries) == 1 else {}
              keys = (
                  "include-component-in-tag",
                  "include-v-in-tag",
                  "tag-separator",
                  "pull-request-title-pattern",
              )
              return {key: package.get(key, config.get(key)) for key in keys}


          def release_tag(pull, config):
              """The tag release-please gives a merged release pull request, or None for any other pull."""
              base_ref = (pull.get("base") or {}).get("ref") or ""
              head_ref = (pull.get("head") or {}).get("ref") or ""
              # release-please's branch names: release-please--branches--<base>[--components--<component>]
              branch = re.fullmatch(
                  rf"release-please--branches--{re.escape(base_ref)}(?:--components--(.+))?", head_ref
              )
              if not base_ref or not branch:
                  return None
              component = branch.group(1) or ""
              settings = package_settings(config, component)
              if settings["pull-request-title-pattern"]:
                  return None
              # release-please's default title pattern, chore${scope}: release${component} ${version}.
              title = re.fullmatch(
                  r"chore(?:\((?P<branch>[\w./-]+)\))?: release ?(?:@?[\w./-]*)? "
                  r"v?(?P<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?)",
                  pull.get("title") or "",
              )
              if not title or title.group("branch") not in (None, base_ref):
                  return None
              prefix = "v" if settings["include-v-in-tag"] is not False else ""
              if component and settings["include-component-in-tag"] is not False:
                  separator = settings["tag-separator"] if isinstance(settings["tag-separator"], str) else "-"
                  prefix = f"{component}{separator}{prefix}"
              return prefix + title.group("version")


          def parse_release_pull(pull, config):
              """Validate a merged release pull request and return item dict or None."""
              labels = {lbl.get("name") for lbl in pull.get("labels", []) if isinstance(lbl, dict)}
              if PENDING_LABEL not in labels:
                  return None
              num = pull.get("number")
              sha = pull.get("merge_commit_sha") or ""
              tag = release_tag(pull, config)
              if not (pull.get("merged_at") and tag and re.fullmatch(r"[0-9a-fA-F]{40}", sha)):
                  sys.stdout.write(f"::warning::pull #{num} labelled {PENDING_LABEL} fails release checks\n")
                  return None
              return {"number": num, "sha": sha, "tag": tag}


          def as_rest_pull(node):
              """A GraphQL pull request node in the shape of the REST pulls API the checks read."""
              return {
                  "number": node.get("number"),
                  "state": str(node.get("state") or "").lower(),
                  "title": node.get("title"),
                  "merged_at": node.get("mergedAt"),
                  "merge_commit_sha": (node.get("mergeCommit") or {}).get("oid"),
                  "base": {"ref": node.get("baseRefName") or ""},
                  "head": {"ref": node.get("headRefName") or ""},
                  "labels": list(((node.get("labels") or {}).get("nodes") or [])[:100]),
              }


          def read_pulls(graphql_url, repo, token):
              """The 20 newest closed and the 100 newest open pull requests, needed fields only."""
              owner, _, name = repo.partition("/")
              body = {"query": PULLS_QUERY, "variables": {"owner": owner, "name": name}}
              _, answer = call(graphql_url, token, method="POST", body=body, read_only=True)
              data = answer.get("data") if isinstance(answer, dict) else None
              found = (data or {}).get("repository")
              if not isinstance(found, dict) or answer.get("errors"):
                  errors = answer.get("errors") if isinstance(answer, dict) else answer
                  raise CallError(f"POST {graphql_url}: pull request read failed: {json.dumps(errors)[:500]}")
              lists = {}
              for key, limit in (("closed", 20), ("open", 100)):
                  nodes = (found.get(key) or {}).get("nodes")
                  if not isinstance(nodes, list):
                      raise CallError(f"POST {graphql_url}: expected list of {key} pulls")
                  lists[key] = [as_rest_pull(node) for node in nodes[:limit] if isinstance(node, dict)]
              return lists["closed"], lists["open"]


          def read_pending(pulls, config):
              """List merged release pull requests still carrying autorelease: pending."""
              pending = []
              for pull in pulls[:20]:
                  item = parse_release_pull(pull, config)
                  if item is not None:
                      pending.append(item)
              return pending


          def read_frozen(pulls, hold):
              """Open release pull requests a person froze: a hold label or a release label past pending."""
              frozen = []
              for pull in pulls[:100]:
                  if pull.get("state") != "open":
                      continue
                  if not pull.get("head", {}).get("ref", "").startswith(RELEASE_HEAD):
                      continue
                  labels = {lbl.get("name", "") for lbl in pull.get("labels", []) if isinstance(lbl, dict)}
                  release = {n for n in labels if n.startswith(RELEASE_LABEL) and n != PENDING_LABEL}
                  named = sorted((labels & hold) | release)
                  if named:
                      frozen.append(f"#{pull['number']} ({', '.join(named)})")
              return frozen


          def cmd_settings(env):
              """Read release settings and emit skip and pending outputs."""
              api_url = env.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
              repo = env["REPO"]
              token = env["TOKEN"]
              config = read_config(api_url, repo, token)
              try:
                  skip = evaluate_skip(config) or reads_own_release(api_url, repo, token)
              except ValueError as err:
                  sys.stdout.write(f"::error::{err}\n")
                  return 1
              if isinstance(skip, str):
                  sys.stdout.write(
                      f"::notice::{repo} runs release-please in its own workflow {skip}; "
                      "the train creates no release\n"
                  )
              closed, opened = read_pulls(env.get("GITHUB_GRAPHQL_URL", f"{api_url}/graphql"), repo, token)
              pending = read_pending(closed, config)
              hold = frozenset(name for name in env.get("HOLD_LABELS", "").split(",") if name)
              frozen = read_frozen(opened, hold)
              for item in frozen:
                  sys.stdout.write(f"::notice::release pull request {item} is frozen; not updated\n")
              out_file = env.get("GITHUB_OUTPUT")
              if out_file:
                  skip_str = "true" if skip else "false"
                  pending_str = json.dumps(pending, separators=(",", ":"))
                  frozen_str = "true" if frozen else "false"
                  with open(out_file, "a", encoding="utf-8") as f:
                      f.write(f"skip={skip_str}\npending={pending_str}\nfrozen={frozen_str}\n")
              return 0


          def get_tag_commit(api_url, repo, token, tag):
              """Resolve the commit SHA for a tag ref, unwrapping annotated tags once."""
              tag_quoted = urllib.parse.quote(tag, safe="")
              url = f"{api_url}/repos/{repo}/git/matching-refs/tags/{tag_quoted}"
              try:
                  _, entries = call(url, token, method="GET")
              except CallError as err:
                  if err.status == 404:
                      return None
                  raise
              if not isinstance(entries, list):
                  return None
              if len(entries) >= 30:
                  raise CallError(f"matching-refs for {tag}: {len(entries)} entries (>= 30)")
              exact = f"refs/tags/{tag}"
              entry = None
              for item in entries[:30]:
                  if item.get("ref") == exact:
                      entry = item
                      break
              if not entry:
                  return None
              obj = entry.get("object", {})
              obj_type = obj.get("type")
              sha = obj.get("sha")
              if obj_type == "commit":
                  return sha
              if obj_type == "tag" and sha:
                  tag_url = f"{api_url}/repos/{repo}/git/tags/{sha}"
                  _, tag_data = call(tag_url, token, method="GET")
                  target_obj = tag_data.get("object", {})
                  if target_obj.get("type") == "commit":
                      return target_obj.get("sha")
              return None


          def move_pending_labels(api_url, repo, token, pending):
              """For each pending item with tag on commit: add tagged label, then delete pending."""
              for item in pending[:100]:
                  commit = get_tag_commit(api_url, repo, token, item["tag"])
                  if commit == item["sha"]:
                      num = item["number"]
                      post_url = f"{api_url}/repos/{repo}/issues/{num}/labels"
                      call(post_url, token, method="POST", body={"labels": [TAGGED_LABEL]})
                      del_quoted = urllib.parse.quote(PENDING_LABEL, safe="")
                      del_url = f"{api_url}/repos/{repo}/issues/{num}/labels/{del_quoted}"
                      call(del_url, token, method="DELETE")
                  else:
                      sys.stdout.write(
                          f"::notice::pull #{item['number']} stays pending (tag not yet on merge commit)\n"
                      )
              return 0


          def judge_failed_release(api_url, repo, token, pending):
              """Judge a failed release-please run when releases were not skipped."""
              if not pending:
                  sys.stdout.write("::error::release step failed and pending is empty\n")
                  return 1
              for item in pending[:100]:
                  pull_url = f"{api_url}/repos/{repo}/pulls/{item['number']}"
                  _, pull = call(pull_url, token, method="GET")
                  labels = {lbl.get("name") for lbl in pull.get("labels", []) if isinstance(lbl, dict)}
                  if PENDING_LABEL in labels:
                      sys.stdout.write(f"::error::pull #{item['number']} still carries {PENDING_LABEL}\n")
                      return 1
                  commit = get_tag_commit(api_url, repo, token, item["tag"])
                  if commit != item["sha"]:
                      sys.stdout.write(f"::error::tag {item['tag']} commit {commit} != {item['sha']}\n")
                      return 1
                  tag_quoted = urllib.parse.quote(item["tag"], safe="")
                  rel_url = f"{api_url}/repos/{repo}/releases/tags/{tag_quoted}"
                  status, _ = call(rel_url, token, method="GET", status_only=True)
                  if status != 200:
                      sys.stdout.write(f"::error::release {item['tag']} returned HTTP {status}\n")
                      return 1
              for item in pending[:100]:
                  sys.stdout.write(f"::notice::release {item['tag']} existed on the release commit; done\n")
              return 0


          def cmd_after(env):
              """Move release labels or judge a failed release run."""
              api_url = env.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
              repo = env["REPO"]
              token = env["TOKEN"]
              skip = env.get("SKIP", "false").lower() == "true"
              outcome = env.get("OUTCOME", "")
              raw_pending = env.get("PENDING", "[]")
              pending = json.loads(raw_pending) if raw_pending else []
              if skip:
                  return move_pending_labels(api_url, repo, token, pending)
              if outcome in ("success", "skipped"):
                  return 0
              if outcome == "failure":
                  return judge_failed_release(api_url, repo, token, pending)
              sys.stdout.write(f"::error::unexpected release outcome: {outcome}\n")
              return 1


          def main(argv, env):
              """Dispatch settings or after command."""
              if len(argv) < 2:
                  sys.stderr.write("usage: release_labels.py <settings|after>\n")
                  return 2
              commands = {"settings": cmd_settings, "after": cmd_after}
              if argv[1] not in commands:
                  sys.stderr.write(f"unknown command: {argv[1]}\n")
                  return 2
              try:
                  return commands[argv[1]](env)
              except (CallError, KeyError, json.JSONDecodeError) as err:
                  sys.stdout.write(f"::error title=Release labels::{argv[1]}: {err}\n")
                  return 1


          if __name__ == "__main__":
              sys.exit(main(sys.argv, os.environ))
          PY

      - name: Read the release settings
        id: settings
        shell: bash
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ matrix.repository.owner }}/${{ matrix.repository.name }}
          HOLD_LABELS: ${{ inputs.hold_labels }}
        run: python3 "$RUNNER_TEMP/release_labels.py" settings

      - name: Create the releases of merged release pull requests
        id: release
        if: steps.settings.outputs.skip == 'false'
        continue-on-error: true
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}
          repo-url: ${{ matrix.repository.owner }}/${{ matrix.repository.name }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      - name: Move the labels, or judge a failed release run
        shell: bash
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ matrix.repository.owner }}/${{ matrix.repository.name }}
          SKIP: ${{ steps.settings.outputs.skip }}
          OUTCOME: ${{ steps.release.outcome }}
          PENDING: ${{ steps.settings.outputs.pending }}
        run: python3 "$RUNNER_TEMP/release_labels.py" after

      - name: Open or update the release pull request
        if: steps.settings.outputs.frozen == 'false'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}
          repo-url: ${{ matrix.repository.owner }}/${{ matrix.repository.name }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
