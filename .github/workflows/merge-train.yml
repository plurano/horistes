---
# Merge train (reusable): one sweep over every repository the merge-train
# app is installed on, landing pull requests one at a time without a session
# or a person driving it (decision record 0029). In each repository a run does
# at most one write:
#
# - It lands the oldest pull request the forge reports CLEAN (or a state the
#   caller accepts in `accept_states`), through the merge mutation with the
#   head commit it read. The forge refuses that merge when a required check or
#   rule fails, and the app has no bypass, so nothing red lands.
# - When none is CLEAN and no armed pull request is still in flight, it arms
#   auto-merge on the oldest BEHIND pull request whose checks are not red (each
#   workflow judged by its newest run; decision record 0042), and
#   merges the default branch into its head (update-branch, never a rebase:
#   a forge rebase re-commits the head unsigned). The forge offers auto-merge
#   only while a pull request cannot merge at once, so BEHIND is where arming
#   happens; a CLEAN pull request is landed directly.
# - It updates only a pull request that is armed or that it arms: where the
#   repository allows no auto-merge, an unarmed BEHIND pull request stays as it
#   is. Where a ruleset on the default branch demands linear history, or the
#   rules cannot be read, it updates nothing and reports BEHIND: a merge
#   commit would break that rule (decision record 0044).
# - When nothing lands and no armed pull request is in flight, a red pull
#   request whose red runs failed only at the step "Stop on a draft pull
#   request" gets the label `merge-train: refresh` added and removed: a run
#   started before "ready for review" replays the draft payload on a re-run,
#   while the label events carry the current one (decision record 0041). Once
#   per failed run; workflows without labeled or unlabeled triggers stay red,
#   and the summary says a person pushes.
# - In flight means armed with checks still running (BLOCKED). An armed pull
#   request that is BEHIND cannot land until the default branch is merged into
#   it, so it holds nothing: the sweep updates it first, before it arms another.
# - A merge the forge answers with "Merge already in progress" is in flight,
#   not refused: the next run reads the pull request again.
# - When squashing, the train writes the squash commit message from the pull
#   request's own non-merge commits and their sign-offs (decision record 0037),
#   without Co-authored-by trailers.
# - After that write, it closes the open issues that the pull requests it
#   merged in the last 7 days name as closed (`Closes #N` and the forge's
#   other closing forms): the forge leaves them open when the app merges, and
#   that holds for auto-merges the forge carries out for the app too
#   (decision record 0039). Same repository only; an issue reopened after the
#   merge stays open.
#
# Left alone: drafts, superseded pull requests (label `superseded`, a body
# that says "Superseded by #N", or another open pull request whose body says
# "Supersedes #N"; decision record 0038), pull requests from forks, a base
# other than the default branch, the labels in `hold_labels`, heads in
# `person_branches` (release pull requests by default: a release is a
# person's act), dependency updates whose own commit (the update bot's, not
# a repin or a merge pushed on top) is younger than `min_age_days` (3 days,
# the fleet's minimum age; a security label or "[SECURITY]" in the title
# skips the wait), and archived repositories. A repository leaves the train
# when the app is uninstalled from it.
#
# RELEASES. A repository with release-please-config.json and
# .release-please-manifest.json on its default branch gets a second job after
# the sweep (decision records 0031, 0040): release-please with a token of the
# app limited to that repository, contents, pull requests and workflows write.
# The job splits release creation and release pull request updates into separate
# steps: a repository that writes its own release skips release creation and has
# its labels moved once the tag is on the merge commit, while a pre-existing
# release is verified. The train never merges: heads in `person_branches` stay
# untouched, so a release stays a person's act. The app's events start workflow
# runs, so the release pull request gets its required checks and the release
# starts the repository's `release: published` workflows. `switch: off` runs no
# release job.
#
# CREDENTIAL. One repository holds the app's private key, as the secret
# MERGE_TRAIN_APP_KEY of its environment `merge-train`; the environment lets
# only the default branch deploy, so a workflow edited on another branch never
# reads the key. The job runs in that environment and the caller passes the
# secret as `app_private_key` and the client id as `app_client_id`. The key
# signs a JWT of the app (openssl, the key through a pipe, never a file).
# For every repository the job mints a token limited to that repository, with
# contents, pull requests and workflows write, checks and actions read (read
# rights only when `switch` is off), and revokes it when the repository is done.
# Only when an issue is to be closed, a second token for that repository
# carries issues write alone, for the comment and the close.
# Workflows write is there because the forge refuses a merge or an
# update-branch that changes a file under .github/workflows without it: pin
# updates do, and so does an update after the default branch changed a
# workflow. Events GITHUB_TOKEN causes start no workflow run, so a head it
# updated would never get its checks. GITHUB_TOKEN gets no permission at all.
#
# A refusal in one repository is reported and the sweep goes on; the run ends
# red when any repository refused. Repositories not reached within 25 minutes
# are named in the summary.
name: Merge train

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Label of the runner the job runs on. It needs python3 and the openssl
          command; there is no default, so the caller names its own runner.
        type: string
        required: true
      app_client_id:
        description: Client id of the merge-train app.
        type: string
        required: true
      switch:
        description: on lands and updates; off only reports.
        type: string
        required: false
        default: "on"
      merge_method:
        description: SQUASH or MERGE. A forge rebase is refused (unsigned commits).
        type: string
        required: false
        default: SQUASH
      accept_states:
        description: >-
          Merge states landed besides CLEAN, separated by spaces: UNSTABLE,
          HAS_HOOKS. Only for a repository that declares them acceptable.
        type: string
        required: false
        default: ""
      min_age_days:
        description: Minimum age of a dependency update, whole days from 0 to 30.
        type: string
        required: false
        default: "3"
      hold_labels:
        description: Labels that keep a pull request out of the train, comma-separated.
        type: string
        required: false
        default: hold,do-not-merge,planted
      dependency_branches:
        description: Head prefixes of dependency updates, separated by spaces.
        type: string
        required: false
        default: renovate/ dependabot/
      person_branches:
        description: Head prefixes only a person lands, separated by spaces.
        type: string
        required: false
        default: release-please--
      security_labels:
        description: Labels that exempt a dependency update from the minimum age, comma-separated.
        type: string
        required: false
        default: security
    secrets:
      app_private_key:
        description: >-
          Private key of the merge-train app, the secret of the environment
          merge-train of the calling repository.
        required: true

permissions: {}

jobs:
  train:
    name: Merge train
    runs-on: ${{ inputs.runner }}
    environment: merge-train
    timeout-minutes: 30
    permissions: {}
    outputs:
      releases: ${{ steps.sweep.outputs.releases }}
    steps:
      # The train's pure rules (which pull request it lands, updates or leaves
      # alone, which issues it closes, and the squash message) and its GraphQL
      # documents, written as a module the train script imports: the script alone
      # would exceed the engine's cap of 4096 fields per run script (decision
      # records 0034, 0037, 0039).
      - name: Write the train rules module
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/train_rules.py" <<'PY'
          """Merge train rules: verdicts, issues to close, squash message, GraphQL documents."""

          import re
          from datetime import datetime

          RED = ("FAILURE", "TIMED_OUT", "CANCELLED", "ACTION_REQUIRED", "STARTUP_FAILURE")
          SUPERSEDES = re.compile(
              r"\bsupersedes\s+(#\d+(?:(?:\s*,\s*|\s*,?\s*and\s+|\s+)#\d+)*)", re.I
          )
          SUPERSEDED_BY = re.compile(r"\bsuperseded\s+by\s+#\d+", re.I)
          DRAFT_STEP = "Stop on a draft pull request"
          REFRESH_LABEL = "merge-train: refresh"
          REFRESH_LIMIT = 3
          STILL_STOPPED = "stopped at the draft step, a refresh started no run: a person pushes"


          def update_made(pull):
              """Commit time of the oldest commit of the last 20 that is no merge, or None.

              The update bot rewrites its branch for every new version, so its commit is
              the oldest one; a repin pushed on top, or a merge from the default branch,
              does not restart the wait. With more commits than are read, a younger one
              stands in, which only lengthens the wait.
              """
              times = [
                  node["commit"]["committedDate"]
                  for node in pull["history"]["nodes"]
                  if node["commit"]["parents"]["totalCount"] == 1
              ]
              return datetime.fromisoformat(min(times)) if times else None


          def suite_key(suite):
              """Key grouping check suites of the same workflow or app."""
              run = suite.get("workflowRun")
              if run and run.get("workflow"):
                  return ("workflow", run["workflow"]["databaseId"])
              app = suite.get("app") or {}
              return ("app", app.get("slug") or "")


          def suite_rank(suite):
              """Creation time, then id: the later of two suites of one key ranks higher."""
              return (suite.get("createdAt") or "", suite.get("databaseId") or 0)


          def newest_suites(suites):
              """Per key the suite with the greatest (createdAt, databaseId)."""
              newest = {}
              for suite in suites:
                  key = suite_key(suite)
                  if key not in newest or suite_rank(suite) > suite_rank(newest[key]):
                      newest[key] = suite
              return newest


          def is_red(pull):
              """Each workflow judged by its newest run on the head commit.

              A run a newer run of the same workflow cancelled is not red; decision
              record 0042.
              """
              nodes = pull["latest"]["nodes"]
              suites = nodes[-1]["commit"]["checkSuites"]["nodes"] if nodes else []
              return any(suite["conclusion"] in RED for suite in newest_suites(suites).values())


          def too_young(pull, labels, conf, now):
              """Why a dependency update waits for its minimum age, or None."""
              if not pull["headRefName"].startswith(conf["dependency"]):
                  return None
              if labels & conf["security"] or "[SECURITY]" in pull["title"]:
                  return None
              changed = update_made(pull)
              if changed is None:
                  return "dependency update with no commit of its own to date"
              if now - changed < conf["min_age"]:
                  return f"dependency update made {changed:%Y-%m-%d %H:%M}Z, younger than the minimum age"
              return None


          def superseded(pulls):
              """Numbers of open pull requests another open one supersedes, or that say so themselves."""
              found = set()
              for pull in pulls:
                  body = pull.get("body") or ""
                  for listed in SUPERSEDES.findall(body):
                      found.update(int(number) for number in re.findall(r"#(\d+)", listed))
                  if SUPERSEDED_BY.search(body):
                      found.add(pull["number"])
              return frozenset(found)


          def verdict(pull, repo, conf, now, replaced=frozenset()):
              """land, behind, or the reason the train leaves the pull request alone."""
              labels = frozenset(label["name"] for label in pull["labels"]["nodes"])
              state = pull["mergeStateStatus"]
              held = sorted(labels & conf["hold"])
              if pull["baseRefName"] != repo["defaultBranchRef"]["name"]:
                  return "not for the default branch"
              if pull["isDraft"]:
                  return "draft"
              if "superseded" in labels or pull["number"] in replaced:
                  return "superseded: a person closes it"
              if pull.get("isInMergeQueue"):
                  return "in the merge queue"
              if pull["isCrossRepository"]:
                  return "from another repository: a person lands it"
              if held:
                  return f"labelled {held[0]}"
              if conf["person"] and pull["headRefName"].startswith(conf["person"]):
                  return "release or reserved branch: a person lands it"
              young = too_young(pull, labels, conf, now)
              if young:
                  return young
              if state in conf["accept"]:
                  return "land"
              if state == "BEHIND":
                  return "red" if is_red(pull) else "behind"
              return f"merge state {state}"


          def linear_history(repo):
              """Whether the default branch takes no merge commit; True when its rules are unread."""
              rules = (repo["defaultBranchRef"] or {}).get("rules")
              if not rules or rules.get("nodes") is None:
                  return True
              return any(rule["type"] == "REQUIRED_LINEAR_HISTORY" for rule in rules["nodes"])


          def updatable(repo, rows, notes):
              """BEHIND pull requests the train may update, armed ones first, each with whether to arm it.

              An armed pull request goes first: it already waits for the forge to merge it.
              Only an armed pull request is updated, and none where the default branch
              demands linear history (decision record 0044); `notes` says why one is skipped.
              """
              behind = [pull for pull, reason in rows if reason == "behind"]
              if linear_history(repo):
                  for pull in behind:
                      notes[pull["number"]] = "behind: linear history, a person rebases"
                  return []
              behind.sort(key=lambda pull: not pull["autoMergeRequest"])
              picked = []
              for pull in behind:
                  if pull["autoMergeRequest"] or repo["autoMergeAllowed"]:
                      picked.append((pull, not pull["autoMergeRequest"]))
                  else:
                      notes[pull["number"]] = "behind: auto-merge off, not armed, not updated"
              return picked


          def in_flight(pull, reason):
              """An armed pull request whose checks still run holds the train.

              An armed BEHIND pull request does not: it cannot land before it is updated.
              """
              armed = bool(pull["autoMergeRequest"])
              return armed and reason == "merge state BLOCKED" and not is_red(pull)


          def red_runs(pull):
              """(run id, creation time) per workflow whose newest run on the head commit is red."""
              nodes = pull["latest"]["nodes"]
              suites = nodes[-1]["commit"]["checkSuites"]["nodes"] if nodes else []
              return [
                  ((suite["workflowRun"] or {}).get("databaseId"), suite["createdAt"])
                  for suite in newest_suites(suites).values()
                  if suite["conclusion"] in RED
              ]


          def refresh_candidates(rows):
              """Red pull requests a fresh event could unblock, oldest first, at most REFRESH_LIMIT."""
              waiting = ("red", "merge state BLOCKED", "merge state UNSTABLE")
              found = [pull for pull, reason in rows if reason in waiting and red_runs(pull)]
              return found[:REFRESH_LIMIT]


          def stopped_at_draft_step(jobs):
              """Whether the failed steps of a run's jobs are the draft step and nothing else."""
              failed = {
                  step["name"]
                  for job in jobs
                  for step in job.get("steps") or []
                  if step.get("conclusion") == "failure"
              }
              return failed == {DRAFT_STEP}


          def refreshed_since(pull, created):
              """Whether REFRESH_LABEL was removed at or after a run was created: no run followed it."""
              when = datetime.fromisoformat(created)
              return any(
                  event["label"]["name"] == REFRESH_LABEL
                  and datetime.fromisoformat(event["createdAt"]) >= when
                  for event in pull["refreshes"]["nodes"]
              )


          def refresh(rows, notes, jobs, toggle):
              """Give the oldest pull request whose red runs stopped at the draft step a fresh event.

              A re-run replays the draft payload; a label event carries the current one
              (decision record 0041). Once per failed run: a refresh that started no run
              is left to a person. jobs reads a run's jobs; toggle adds and removes REFRESH_LABEL.
              """
              for pull in refresh_candidates(rows):
                  runs = red_runs(pull)
                  if not all(run and stopped_at_draft_step(jobs(run)) for run, _ in runs):
                      continue
                  if refreshed_since(pull, max(created for _, created in runs)):
                      notes[pull["number"]] = STILL_STOPPED
                      continue
                  toggle(pull)
                  notes[pull["number"]] = "refreshed: its red runs stopped at the draft step"
                  return f"refreshed #{pull['number']}"
              return None


          def issues_to_close(merged, repository, bot, since):
              """(pull request, merge commit, issue) for each open issue a train merge should have closed.

              The forge leaves the issues a pull request closes open when the train merges it
              (decision record 0039). Only pull requests the app merged since `since`, only
              issues of the same repository, and never an issue reopened after the merge:
              reopening is a person's call.
              """
              found = []
              for pull in merged:
                  merged_at = datetime.fromisoformat(pull["mergedAt"])
                  if (pull["mergedBy"] or {}).get("login") != bot or merged_at < since:
                      continue
                  for issue in pull["closingIssuesReferences"]["nodes"]:
                      if issue["state"] != "OPEN" or issue["repository"]["nameWithOwner"] != repository:
                          continue
                      reopened = [
                          datetime.fromisoformat(event["createdAt"])
                          for event in issue["timelineItems"]["nodes"]
                      ]
                      if any(when > merged_at for when in reopened):
                          continue
                      found.append((pull["number"], pull["mergeCommit"]["oid"], issue["number"]))
              return found


          def clean_commit(message, sign_offs):
              """Subject and trailer-stripped body of one commit; appends new sign-offs."""
              subject, _, rest = message.partition("\n")
              kept = []
              for line in rest.splitlines():
                  text = line.strip()
                  low = text.lower()
                  if low.startswith("signed-off-by:") and text[14:].strip():
                      if text not in sign_offs:
                          sign_offs.append(text)
                  elif not low.startswith("co-authored-by:"):
                      kept.append(line)
              return subject.strip(), "\n".join(kept).strip()


          def squash_message(title, number, messages):
              """Headline and body of a squash merge from the non-merge commit messages."""
              entries, sign_offs = [], []
              for message in messages:
                  subject, body = clean_commit(message, sign_offs)
                  if len(messages) == 1:
                      entries.append(body)
                  else:
                      entries.append(f"* {subject}\n\n{body}" if body else f"* {subject}")
              if not sign_offs:
                  raise ValueError("no Signed-off-by on its commits")
              headline = f"{title} (#{number})"
              prefix = "\n\n".join(e for e in entries if e)
              full_body = f"{prefix}\n\n" + "\n".join(sign_offs) if prefix else "\n".join(sign_offs)
              lines = full_body.lower().splitlines()
              if any(line.strip().startswith("co-authored-by:") for line in lines):
                  raise ValueError("squash message holds a Co-authored-by line")
              return headline, full_body

          QUERY = """
          query($owner: String!, $name: String!, $after: String) {
            repository(owner: $owner, name: $name) {
              defaultBranchRef { name rules(first: 50) { nodes { type } } }
              autoMergeAllowed
              mergeQueue { id }
              releaseConfig: object(expression: "HEAD:release-please-config.json") { oid }
              releaseManifest: object(expression: "HEAD:.release-please-manifest.json") { oid }
              pullRequests(states: OPEN, first: 25, after: $after,
                           orderBy: {field: CREATED_AT, direction: ASC}) {
                pageInfo { hasNextPage endCursor }
                nodes {
                  number id title body isDraft isCrossRepository baseRefName headRefName headRefOid
                  mergeStateStatus isInMergeQueue
                  autoMergeRequest { enabledAt }
                  labels(first: 50) { nodes { name } }
                  refreshes: timelineItems(itemTypes: [UNLABELED_EVENT], last: 5) {
                    nodes { ... on UnlabeledEvent { createdAt label { name } } }
                  }
                  history: commits(last: 20) {
                    nodes { commit { committedDate parents { totalCount } } }
                  }
                  latest: commits(last: 1) {
                    nodes {
                      commit {
                        checkSuites(first: 30) {
                          nodes {
                            databaseId
                            conclusion
                            createdAt
                            app { slug }
                            workflowRun { databaseId workflow { databaseId } }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
          """
          COMMITS = """
          query($owner: String!, $name: String!, $number: Int!) {
            repository(owner: $owner, name: $name) {
              pullRequest(number: $number) {
                commits(first: 100) {
                  totalCount
                  nodes { commit { message parents { totalCount } } }
                }
              }
            }
          }
          """
          # The newest merged pull requests and the issues each one closes, for the close step.
          MERGED = """
          query($owner: String!, $name: String!) {
            repository(owner: $owner, name: $name) {
              pullRequests(states: MERGED, first: 10, orderBy: {field: UPDATED_AT, direction: DESC}) {
                nodes {
                  number mergedAt
                  mergedBy { login }
                  mergeCommit { oid }
                  closingIssuesReferences(first: 25) {
                    nodes {
                      number state
                      repository { nameWithOwner }
                      timelineItems(itemTypes: [REOPENED_EVENT], last: 5) {
                        nodes { ... on ReopenedEvent { createdAt } }
                      }
                    }
                  }
                }
              }
            }
          }
          """
          MERGE = """
          mutation($id: ID!, $oid: GitObjectID!, $method: PullRequestMergeMethod!,
                   $headline: String, $body: String) {
            mergePullRequest(
              input: {pullRequestId: $id, expectedHeadOid: $oid, mergeMethod: $method,
                      commitHeadline: $headline, commitBody: $body}
            ) {
              pullRequest { merged }
            }
          }
          """
          # A default branch with a merge queue refuses a direct merge; the queue lands it.
          ENQUEUE = """
          mutation($id: ID!, $oid: GitObjectID!) {
            enqueuePullRequest(input: {pullRequestId: $id, expectedHeadOid: $oid}) {
              mergeQueueEntry { state }
            }
          }
          """
          ARM = """
          mutation($id: ID!, $oid: GitObjectID!, $method: PullRequestMergeMethod!,
                   $headline: String, $body: String) {
            enablePullRequestAutoMerge(
              input: {pullRequestId: $id, expectedHeadOid: $oid, mergeMethod: $method,
                      commitHeadline: $headline, commitBody: $body}
            ) {
              pullRequest { autoMergeRequest { enabledAt } }
            }
          }
          """
          COMMIT_MUTATION = """
          mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) {
              commit { oid }
            }
          }
          """
          PY

      # Merge train of every repository the app is installed on.
      #
      # In each repository it lands one clean pull request, or updates the next one.
      #
      # The app's key signs a short-lived JWT (openssl, the key passed through a pipe
      # and never written to a file). With it the sweep lists the app's installations,
      # reads each installation's repositories with a read-only token, and mints for
      # every repository a token limited to that one repository; the train runs with
      # it, and the token is revoked at once. A refusal in one repository is recorded
      # and the sweep goes on with the next.
      #
      # Exit codes: 0 done, 1 a forge call failed or was refused, 3 a setting is invalid.
      - name: Land or update one pull request in every repository of the app
        id: sweep
        shell: python
        env:
          TRAIN_APP_CLIENT_ID: ${{ inputs.app_client_id }}
          TRAIN_APP_KEY: ${{ secrets.app_private_key }}
          TRAIN_SWITCH: ${{ inputs.switch }}
          TRAIN_MERGE_METHOD: ${{ inputs.merge_method }}
          TRAIN_ACCEPT_STATES: ${{ inputs.accept_states }}
          TRAIN_MIN_AGE_DAYS: ${{ inputs.min_age_days }}
          TRAIN_HOLD_LABELS: ${{ inputs.hold_labels }}
          TRAIN_DEPENDENCY_BRANCHES: ${{ inputs.dependency_branches }}
          TRAIN_PERSON_BRANCHES: ${{ inputs.person_branches }}
          TRAIN_SECURITY_LABELS: ${{ inputs.security_labels }}
        run: |
          import base64
          import hashlib
          import io
          import json
          import os
          import shutil
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile
          from datetime import UTC, datetime, timedelta

          sys.path.insert(0, os.environ["RUNNER_TEMP"])
          from train_rules import (
              ARM,
              COMMIT_MUTATION,
              COMMITS,
              ENQUEUE,
              MERGE,
              MERGED,
              QUERY,
              REFRESH_LABEL,
              in_flight,
              issues_to_close,
              refresh,
              squash_message,
              superseded,
              updatable,
              verdict,
          )

          TIMEOUT = 30
          SETTLE_ROUNDS = 3
          SETTLE_SECONDS = 5
          PULL_PAGES = 4
          READ_ATTEMPTS = 3
          READ_BACKOFF_SECONDS = 5
          SWEEP_SECONDS = 1500
          MAX_PAGES = 20
          JWT_SECONDS = 540
          MAX_RELEASES = 256
          MAX_ARTIFACT_BYTES = 16 * 1024 * 1024
          WRITE_RIGHTS = {
              "actions": "read",
              "contents": "write",
              "pull_requests": "write",
              "workflows": "write",
              "checks": "read",
          }
          READ_RIGHTS = {"contents": "read", "pull_requests": "read", "checks": "read"}
          ISSUE_RIGHTS = {"issues": "write"}
          CLOSE_DAYS = 7
          LIST_RIGHTS = {"metadata": "read"}
          METHODS = ("SQUASH", "MERGE")
          ACCEPTABLE = ("UNSTABLE", "HAS_HOOKS")
          NO_NEW_COMMITS = "There are no new commits on the base branch."
          CONFLICT = "merge conflict between base and head"
          MERGE_IN_PROGRESS = "Merge already in progress"


          class RefusedError(Exception):
              """A forge call that failed or was refused."""


          class MergeInProgressError(RefusedError):
              """The forge answered that it is already merging the pull request."""


          class InvalidSettingError(Exception):
              """A setting outside its allowed values."""


          def settings(env):
              """The inputs of the workflow, each checked against an allow-list."""
              switch = env["TRAIN_SWITCH"]
              method = env["TRAIN_MERGE_METHOD"].upper()
              accept = env["TRAIN_ACCEPT_STATES"].upper().split()
              age = env["TRAIN_MIN_AGE_DAYS"]
              if switch not in ("on", "off"):
                  raise InvalidSettingError(f"switch is {switch!r}, not on or off")
              if method not in METHODS:
                  raise InvalidSettingError(f"merge_method is {method!r}, not one of {', '.join(METHODS)}")
              if any(state not in ACCEPTABLE for state in accept):
                  raise InvalidSettingError(f"accept_states holds {accept}, allowed: {', '.join(ACCEPTABLE)}")
              if not age.isdigit() or int(age) > 30:
                  raise InvalidSettingError(f"min_age_days is {age!r}, not a whole number from 0 to 30")
              if not env.get("TRAIN_APP_CLIENT_ID", "").strip():
                  raise InvalidSettingError("app_client_id is empty")
              if "PRIVATE KEY-----" not in env.get("TRAIN_APP_KEY", ""):
                  raise InvalidSettingError(
                      "the app key is empty or no PEM key: the caller passes no secret, "
                      "or the job runs outside the environment that holds it"
                  )
              return {
                  "switch": switch,
                  "method": method,
                  "accept": frozenset(("CLEAN", *accept)),
                  "min_age": timedelta(days=int(age)),
                  "hold": frozenset(name for name in env["TRAIN_HOLD_LABELS"].split(",") if name),
                  "dependency": tuple(env["TRAIN_DEPENDENCY_BRANCHES"].split()),
                  "person": tuple(env["TRAIN_PERSON_BRANCHES"].split()),
                  "security": frozenset(name for name in env["TRAIN_SECURITY_LABELS"].split(",") if name),
                  "client_id": env["TRAIN_APP_CLIENT_ID"].strip(),
              }


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              """An HTTP redirect handler that does not follow redirects."""

              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None


          def call(url, token=None, method="POST", body=None, raw=False, redirect=True):
              """One request to the forge; the parsed answer, or RefusedError with what it said."""
              data = None if body is None else json.dumps(body).encode()
              request = urllib.request.Request(url, data=data, method=method)
              if token:
                  request.add_header("Authorization", f"Bearer {token}")
              request.add_header("Accept", "application/vnd.github+json")
              request.add_header("X-GitHub-Api-Version", "2022-11-28")
              opener = (
                  urllib.request.build_opener()
                  if redirect
                  else urllib.request.build_opener(NoRedirect)
              )
              try:
                  with opener.open(request, timeout=TIMEOUT) as answer:
                      if raw:
                          content = answer.read(MAX_ARTIFACT_BYTES + 1)
                          if len(content) > MAX_ARTIFACT_BYTES:
                              raise RefusedError(
                                  f"{method} {url}: artifact exceeds {MAX_ARTIFACT_BYTES} bytes"
                              )
                          return content
                      text = answer.read().decode()
              except urllib.error.HTTPError as err:
                  if not redirect and err.code in (301, 302, 303, 307, 308):
                      loc = err.headers.get("Location")
                      return {"location": urllib.parse.urljoin(url, loc) if loc else ""}
                  raise RefusedError(f"{method} {url}: HTTP {err.code} {err.read().decode()[:500]}") from err
              except (urllib.error.URLError, TimeoutError) as err:
                  raise RefusedError(f"{method} {url}: {err}") from err
              return json.loads(text) if text else {}


          def graphql(env, query, variables):
              answer = call(
                  env["GITHUB_GRAPHQL_URL"],
                  env["TRAIN_TOKEN"],
                  body={
                      "query": query,
                      "variables": variables,
                  },
              )
              errors = answer.get("errors")
              if errors and all(
                  error.get("type") == "UNPROCESSABLE" and error.get("message") == MERGE_IN_PROGRESS
                  for error in errors
              ):
                  raise MergeInProgressError(f"GraphQL: {json.dumps(errors)[:500]}")
              if errors or "data" not in answer:
                  raise RefusedError(f"GraphQL: {json.dumps(errors)[:500]}")
              return answer["data"]


          def read_page(env, variables):
              """One page of the read; a forge gateway error (502, 504) is tried again."""
              for attempt in range(1, READ_ATTEMPTS + 1):
                  try:
                      return graphql(env, QUERY, variables)["repository"]
                  except RefusedError as err:
                      if getattr(err.__cause__, "code", 0) not in (502, 504) or attempt == READ_ATTEMPTS:
                          raise
                      time.sleep(READ_BACKOFF_SECONDS)


          def pull_pages(env):
              """The oldest open pull requests, at most PULL_PAGES pages."""
              owner, name = env["GITHUB_REPOSITORY"].split("/", 1)
              variables, pulls, repo = {"owner": owner, "name": name, "after": None}, [], {}
              for _ in range(PULL_PAGES):
                  repo = read_page(env, variables)
                  pulls += repo["pullRequests"]["nodes"]
                  page = repo["pullRequests"]["pageInfo"]
                  if not page["hasNextPage"]:
                      break
                  variables["after"] = page["endCursor"]
              repo["pullRequests"]["nodes"] = pulls
              return repo


          def fetch(env):
              """The repository and its open pull requests, re-read while a merge state is UNKNOWN."""
              repo = {}
              for attempt in range(SETTLE_ROUNDS):
                  repo = pull_pages(env)
                  pulls = repo["pullRequests"]["nodes"]
                  if all(pull["mergeStateStatus"] != "UNKNOWN" or pull["isDraft"] for pull in pulls):
                      break
                  if attempt + 1 < SETTLE_ROUNDS:
                      time.sleep(SETTLE_SECONDS)
              return repo


          def pull_commits(env, number):
              """The non-merge commit messages of one pull request, oldest first."""
              owner, name = env["GITHUB_REPOSITORY"].split("/", 1)
              data = graphql(env, COMMITS, {"owner": owner, "name": name, "number": number})
              commits = data["repository"]["pullRequest"]["commits"]
              if commits["totalCount"] > 100:
                  raise RefusedError(f"#{number}: more than 100 commits, cannot read every sign-off")
              return [
                  node["commit"]["message"]
                  for node in commits["nodes"]
                  if node["commit"]["parents"]["totalCount"] == 1
              ]


          def commit_variables(env, conf, pull):
              """Variables for MERGE and ARM; headline and body when squashing."""
              base = {"id": pull["id"], "oid": pull["headRefOid"], "method": conf["method"]}
              if conf["method"] != "SQUASH":
                  return base
              messages = pull_commits(env, pull["number"])
              try:
                  headline, body = squash_message(pull["title"], pull["number"], messages)
              except ValueError as err:
                  raise RefusedError(f"#{pull['number']}: {err}") from err
              return {**base, "headline": headline, "body": body}


          def land(env, conf, pull, queue):
              if queue:
                  data = graphql(env, ENQUEUE, {"id": pull["id"], "oid": pull["headRefOid"]})
                  if not data["enqueuePullRequest"]["mergeQueueEntry"]:
                      raise RefusedError(f"#{pull['number']}: no merge queue entry")
                  return "queued"
              try:
                  data = graphql(env, MERGE, commit_variables(env, conf, pull))
              except MergeInProgressError:
                  # The forge is already merging it; the next run reads the result.
                  return "merge in flight"
              if not data["mergePullRequest"]["pullRequest"]["merged"]:
                  raise RefusedError(f"#{pull['number']}: the forge did not report it merged")
              return "landed"


          def arm(env, conf, pull):
              data = graphql(env, ARM, commit_variables(env, conf, pull))
              if not data["enablePullRequestAutoMerge"]["pullRequest"]["autoMergeRequest"]:
                  raise RefusedError(f"#{pull['number']}: the forge returned no auto-merge request")


          def update(env, pull):
              """Merge the default branch into the head branch; False when it conflicts."""
              url = f"{env['GITHUB_API_URL']}/repos/{env['GITHUB_REPOSITORY']}/pulls/{pull['number']}"
              try:
                  call(
                      f"{url}/update-branch",
                      env["TRAIN_TOKEN"],
                      "PUT",
                      {
                          "expected_head_sha": pull["headRefOid"],
                      },
                  )
              except RefusedError as err:
                  if NO_NEW_COMMITS in str(err):
                      return True
                  if CONFLICT in str(err):
                      return False
                  raise
              return True


          def advance(env, conf, repo, rows, notes):
              """Update the first pull request `updatable` names, arming it first where it says."""
              for pull, arming in updatable(repo, rows, notes):
                  if arming:
                      arm(env, conf, pull)
                      notes[pull["number"]] = "armed, updated from the default branch"
                  else:
                      notes[pull["number"]] = "updated from the default branch"
                  if update(env, pull):
                      return
                  notes[pull["number"]] = "conflicts with the default branch"


          def run_jobs(env, run_id):
              """The jobs of one workflow run with their steps, at most 100."""
              api = f"{env['GITHUB_API_URL']}/repos/{env['GITHUB_REPOSITORY']}"
              url = f"{api}/actions/runs/{run_id}/jobs?per_page=100"
              return call(url, env["TRAIN_TOKEN"], "GET")["jobs"]


          def toggle_refresh(env, pull):
              """Add REFRESH_LABEL and remove it: two events that carry the pull request as it is now."""
              api = f"{env['GITHUB_API_URL']}/repos/{env['GITHUB_REPOSITORY']}"
              url = f"{api}/issues/{pull['number']}/labels"
              call(url, env["TRAIN_TOKEN"], "POST", {"labels": [REFRESH_LABEL]})
              name = urllib.parse.quote(REFRESH_LABEL, safe="")
              try:
                  call(f"{url}/{name}", env["TRAIN_TOKEN"], "DELETE")
              except RefusedError as err:
                  if "HTTP 404" not in str(err):
                      raise


          def bot_identity(env, conf, token):
              """The app's bot login and numeric id; the user lookup carries an installation token.

              Unauthenticated, it would share the runner address's 60 calls an hour.
              """
              app = call(f"{env['GITHUB_API_URL']}/app", app_jwt(env, conf), "GET")
              login = f"{app['slug']}[bot]"
              user = call(f"{env['GITHUB_API_URL']}/users/{login}", token, "GET")
              return login, str(user["id"])


          def allowlist_paths(env, default_branch):
              """The paths declared in .github/generated-files on the default branch, or None."""
              url = (
                  f"{env['GITHUB_API_URL']}/repos/{env['GITHUB_REPOSITORY']}/"
                  f"contents/.github/generated-files?ref={default_branch}"
              )
              try:
                  data = call(url, env["TRAIN_TOKEN"], "GET")
              except RefusedError as err:
                  if "HTTP 404" in str(err):
                      return None
                  raise
              if not isinstance(data, dict) or "content" not in data:
                  return None
              raw = base64.b64decode(data["content"]).decode("utf-8", errors="replace")
              lines = [line.split("#", 1)[0].strip() for line in raw.splitlines()]
              return frozenset(p for p in lines if p)


          def find_artifact(env, pull):
              """The newest unexpired regenerated artifact matching the head commit and branch, or None."""
              head_sha = pull["headRefOid"]
              head_branch = pull["headRefName"]
              url = (
                  f"{env['GITHUB_API_URL']}/repos/{env['GITHUB_REPOSITORY']}/"
                  f"actions/artifacts?name=regenerated-{head_sha}&per_page=10"
              )
              answer = call(url, env["TRAIN_TOKEN"], "GET")
              artifacts = answer.get("artifacts", [])
              matching = []
              for art in artifacts:
                  if art.get("expired"):
                      continue
                  run = art.get("workflow_run") or {}
                  if run.get("head_sha") == head_sha and run.get("head_branch") == head_branch:
                      matching.append(art)
              if not matching:
                  return None
              matching.sort(
                  key=lambda a: (a.get("created_at") or "", a.get("id") or 0), reverse=True
              )
              return matching[0]


          def download_artifact(env, art):
              """Download the artifact zip without sending Authorization to the storage URL."""
              url = art["archive_download_url"]
              redirect = call(url, env["TRAIN_TOKEN"], "GET", redirect=False)
              storage_url = redirect.get("location")
              if not storage_url:
                  raise RefusedError(f"GET {url}: expected 302 redirect to storage URL")
              expected_scheme = urllib.parse.urlsplit(env["GITHUB_API_URL"]).scheme
              storage_scheme = urllib.parse.urlsplit(storage_url).scheme
              if storage_scheme != expected_scheme:
                  raise RefusedError(
                      f"GET {url}: storage URL scheme {storage_scheme!r} != {expected_scheme!r}"
                  )
              return call(storage_url, None, "GET", raw=True)


          def check_zip_members(repo, num, zf):
              """Validate zip members against zip bombs and duplicates; return file member names."""
              namelist = zf.namelist()
              if len(namelist) != len(set(namelist)):
                  raise RefusedError(f"{repo} #{num}: duplicate zip member names")
              file_members = set()
              total_size = 0
              for info in zf.infolist():
                  if info.file_size < 0 or info.file_size > MAX_ARTIFACT_BYTES:
                      raise RefusedError(
                          f"{repo} #{num}: zip member {info.filename} exceeds {MAX_ARTIFACT_BYTES} bytes"
                      )
                  total_size += info.file_size
                  if total_size > MAX_ARTIFACT_BYTES:
                      raise RefusedError(
                          f"{repo} #{num}: zip total size exceeds {MAX_ARTIFACT_BYTES} bytes"
                      )
                  if info.filename.endswith("/"):
                      if info.file_size > 0:
                          raise RefusedError(
                              f"{repo} #{num}: directory entry {info.filename!r} has size > 0"
                          )
                  else:
                      file_members.add(info.filename)
              return file_members


          def check_safe_path(repo, num, p, allowlist):
              """Ensure path has no parent traversal, leading slash, backslash, and is allowlisted."""
              if "\\" in p or p.startswith("/") or ".." in p or p not in allowlist:
                  raise RefusedError(f"{repo} #{num}: path {p!r} not allowed")


          def check_manifest_entry(repo, num, entry, allowlist, seen_paths):
              """Validate one manifest file entry schema and allowlist path."""
              if not isinstance(entry, dict):
                  raise RefusedError(f"{repo} #{num}: manifest files entry is not a dict")
              p, size, sha = entry.get("path"), entry.get("bytes"), entry.get("sha256")
              if not isinstance(p, str) or not isinstance(sha, str):
                  raise RefusedError(f"{repo} #{num}: invalid manifest entry types")
              if type(size) is not int or size < 0:
                  raise RefusedError(f"{repo} #{num}: invalid manifest entry types")
              if p in seen_paths:
                  raise RefusedError(f"{repo} #{num}: duplicate path {p!r} in manifest files")
              seen_paths.add(p)
              check_safe_path(repo, num, p, allowlist)
              return p, size, sha


          def read_manifest(repo, num, head, zf):
              """Read and validate top-level manifest.json from the zip archive."""
              try:
                  manifest = json.loads(zf.read("manifest.json").decode("utf-8"))
              except Exception as err:
                  raise RefusedError(f"{repo} #{num}: invalid manifest.json: {err}") from err
              if not isinstance(manifest, dict):
                  raise RefusedError(f"{repo} #{num}: manifest.json root is not a dict")
              if manifest.get("schema") != "horistes.generated-files.v1":
                  raise RefusedError(
                      f"{repo} #{num}: unexpected manifest schema {manifest.get('schema')!r}"
                  )
              if manifest.get("head") != head:
                  raise RefusedError(f"{repo} #{num}: manifest head {manifest.get('head')} != {head}")
              files = manifest.get("files")
              if not isinstance(files, list):
                  raise RefusedError(f"{repo} #{num}: manifest files is not a list")
              return manifest, files


          def extract_manifest_files(repo, num, zf, files, names, allowlist):
              """Validate and extract file members declared in manifest.json."""
              expected = {"manifest.json"}
              file_bytes = {}
              seen_paths = set()
              for entry in files:
                  p, size, sha = check_manifest_entry(repo, num, entry, allowlist, seen_paths)
                  member = f"files/{p}"
                  if member not in names:
                      raise RefusedError(f"{repo} #{num}: member {member!r} missing from artifact")
                  expected.add(member)
                  content = zf.read(member)
                  if len(content) != size:
                      raise RefusedError(f"{repo} #{num}: {p} size {len(content)} != {size}")
                  if hashlib.sha256(content).hexdigest() != sha:
                      raise RefusedError(f"{repo} #{num}: {p} sha256 mismatch")
                  file_bytes[p] = content
              if names != expected:
                  extra = sorted(names - expected)
                  raise RefusedError(f"{repo} #{num}: artifact contains unexpected members: {extra}")
              return file_bytes


          def validate_artifact(env, pull, data, allowlist):
              """Validate zip content and manifest, returning (manifest, file_bytes_by_path)."""
              repo = env["GITHUB_REPOSITORY"]
              num = pull["number"]
              head = pull["headRefOid"]
              try:
                  zf = zipfile.ZipFile(io.BytesIO(data))
              except Exception as err:
                  raise RefusedError(f"{repo} #{num}: bad zip archive: {err}") from err
              names = check_zip_members(repo, num, zf)
              if "manifest.json" not in names:
                  raise RefusedError(f"{repo} #{num}: manifest.json missing from artifact")
              manifest, files = read_manifest(repo, num, head, zf)
              file_bytes = extract_manifest_files(repo, num, zf, files, names, allowlist)
              return manifest, file_bytes


          def filter_changed_files(env, pull, file_bytes):
              """Files from the artifact whose content differs from headRefOid."""
              changed = {}
              for path, data in file_bytes.items():
                  url = (
                      f"{env['GITHUB_API_URL']}/repos/{env['GITHUB_REPOSITORY']}/"
                      f"contents/{path}?ref={pull['headRefOid']}"
                  )
                  try:
                      head_file = call(url, env["TRAIN_TOKEN"], "GET")
                  except RefusedError as err:
                      if "HTTP 404" in str(err):
                          head_file = None
                      else:
                          raise
                  blob_sha = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
                  if head_file and head_file.get("sha") == blob_sha:
                      continue
                  changed[path] = data
              return changed


          def commit_generated_files(env, conf, pull, art, changed):
              """Commit changed generated files to the pull request branch via createCommitOnBranch."""
              run = art.get("workflow_run") or {}
              run_ref = run.get("html_url") or run.get("id") or "unknown"
              bot_login = conf["bot_login"]
              bot_id = conf["bot_id"]
              trailer = f"Signed-off-by: {bot_login} <{bot_id}+{bot_login}@users.noreply.github.com>"
              body = (
                  f"Regenerated by the dependency update's own workflow run {run_ref}, "
                  f"artifact regenerated-{pull['headRefOid']}.\n\n{trailer}"
              )
              additions = [
                  {"path": path, "contents": base64.b64encode(data).decode("ascii")}
                  for path, data in sorted(changed.items())
              ]
              variables = {
                  "input": {
                      "branch": {
                          "repositoryNameWithOwner": env["GITHUB_REPOSITORY"],
                          "branchName": pull["headRefName"],
                      },
                      "expectedHeadOid": pull["headRefOid"],
                      "fileChanges": {"additions": additions},
                      "message": {
                          "headline": "chore(deps): regenerate generated files",
                          "body": body,
                      },
                  }
              }
              data = graphql(env, COMMIT_MUTATION, variables)
              if not data.get("createCommitOnBranch", {}).get("commit", {}).get("oid"):
                  raise RefusedError(f"#{pull['number']}: createCommitOnBranch returned no commit")


          def is_candidate(pull, reason, default_branch, conf):
              """Whether a pull request is a candidate for generated file regeneration."""
              if not pull["headRefName"].startswith(conf["dependency"]):
                  return False
              if pull["isDraft"] or pull["isCrossRepository"]:
                  return False
              if pull["baseRefName"] != default_branch:
                  return False
              if reason.startswith("labelled "):
                  return False
              return reason != "release or reserved branch: a person lands it"


          def regenerate(env, conf, repo, rows, notes):
              """Commit regenerated files for the oldest candidate dependency update, or None."""
              if repo["defaultBranchRef"] is None:
                  # An empty repository has no default branch and no pull requests.
                  return None
              default_branch = repo["defaultBranchRef"]["name"]
              candidates = [
                  pull for pull, reason in rows if is_candidate(pull, reason, default_branch, conf)
              ]
              if not candidates:
                  return None
              allowlist = allowlist_paths(env, default_branch)
              if allowlist is None:
                  return None
              for pull in candidates:
                  try:
                      art = find_artifact(env, pull)
                      if not art:
                          continue
                      data = download_artifact(env, art)
                      _, file_bytes = validate_artifact(env, pull, data, allowlist)
                      changed = filter_changed_files(env, pull, file_bytes)
                  except RefusedError as err:
                      notes[pull["number"]] = f"generated files refused: {err}"[:200]
                      continue
                  if not changed:
                      continue
                  commit_generated_files(env, conf, pull, art, changed)
                  notes[pull["number"]] = "generated files committed"
                  return f"committed generated files to #{pull['number']}"
              return None


          def run(env, conf, repo, now):
              pulls = repo["pullRequests"]["nodes"]
              replaced = superseded(pulls)
              rows = [(pull, verdict(pull, repo, conf, now, replaced)) for pull in pulls]
              notes = {pull["number"]: reason for pull, reason in rows}
              if conf["switch"] == "off":
                  return rows, notes, "switched off: nothing landed or updated"
              outcome = regenerate(env, conf, repo, rows, notes)
              if outcome:
                  return rows, notes, outcome
              for pull, reason in rows:
                  if reason == "land":
                      done = notes[pull["number"]] = land(env, conf, pull, repo.get("mergeQueue"))
                      return rows, notes, f"{done} #{pull['number']}"
              holding = [pull["number"] for pull, reason in rows if in_flight(pull, reason)]
              if holding:
                  return rows, notes, f"#{holding[0]} is armed and in flight"
              outcome = refresh(
                  rows, notes, lambda run: run_jobs(env, run), lambda pull: toggle_refresh(env, pull)
              )
              if outcome:
                  return rows, notes, outcome
              advance(env, conf, repo, rows, notes)
              return rows, notes, "no pull request at a mergeable state"


          def report(name, repo, rows, notes, outcome):
              """The section of one repository with open pull requests."""
              lines = [
                  f"### {name}: {outcome}",
                  "",
                  "| Pull request | Merge state | Train |",
                  "|---|---|---|",
              ]
              lines += [
                  f"| #{pull['number']} | {pull['mergeStateStatus']} | {notes[pull['number']]} |"
                  for pull, _ in rows
              ]
              if repo["pullRequests"]["pageInfo"]["hasNextPage"]:
                  lines.append("\nOnly the 100 oldest open pull requests were read.")
              return "\n".join(lines) + "\n"


          def b64url(data):
              return base64.urlsafe_b64encode(data).rstrip(b"=").decode()


          def app_jwt(env, conf):
              """A JWT of the app, signed RS256 by openssl; the key goes through a pipe, never a file."""
              openssl = shutil.which("openssl")
              if not openssl:
                  raise RefusedError("openssl is not on the runner: the app's JWT cannot be signed")
              now = int(time.time())
              claims = {"iat": now - 60, "exp": now + JWT_SECONDS, "iss": conf["client_id"]}
              head = b64url(json.dumps({"alg": "RS256", "typ": "JWT"}).encode())
              signing_input = f"{head}.{b64url(json.dumps(claims).encode())}"
              read_end, write_end = os.pipe()
              with os.fdopen(write_end, "w") as pipe:
                  pipe.write(env["TRAIN_APP_KEY"])
              try:
                  done = subprocess.run(
                      [openssl, "dgst", "-sha256", "-sign", f"/dev/fd/{read_end}"],
                      input=signing_input.encode(),
                      capture_output=True,
                      pass_fds=(read_end,),
                      timeout=TIMEOUT,
                      check=False,
                  )
              finally:
                  os.close(read_end)
              if done.returncode != 0 or not done.stdout:
                  raise RefusedError(f"openssl could not sign the app's JWT (exit {done.returncode})")
              return f"{signing_input}.{b64url(done.stdout)}"


          def pages(env, token, path, key=None):
              """Every item of a paginated list, at most MAX_PAGES pages of 100."""
              items = []
              for page in range(1, MAX_PAGES + 1):
                  answer = call(f"{env['GITHUB_API_URL']}{path}?per_page=100&page={page}", token, "GET")
                  batch = answer[key] if key else answer
                  items += batch
                  if len(batch) < 100:
                      return items
              raise RefusedError(f"GET {path}: more than {MAX_PAGES * 100} entries")


          def mint(env, conf, installation, rights, repositories=None):
              """An installation token with exactly these rights, for these repositories only."""
              body = {"permissions": rights}
              if repositories is not None:
                  body["repositories"] = repositories
              url = f"{env['GITHUB_API_URL']}/app/installations/{installation['id']}/access_tokens"
              return call(url, app_jwt(env, conf), "POST", body)["token"]


          def revoke(env, token):
              call(f"{env['GITHUB_API_URL']}/installation/token", token, "DELETE")


          def repositories(env, conf, installation, identity):
              """The installation's repositories the train serves, read with a read-only token.

              The first call fills identity with the bot login and id, using that token.
              """
              token = mint(env, conf, installation, LIST_RIGHTS)
              try:
                  if not identity:
                      identity["bot_login"], identity["bot_id"] = bot_identity(env, conf, token)
                  listed = pages(env, token, "/installation/repositories", "repositories")
              finally:
                  revoke(env, token)
              return [r for r in listed if not r.get("archived") and not r.get("disabled")]


          def close_issues(env, conf, installation, target, now):
              """Close the open issues that pull requests the app merged name as closed; the lines to report.

              The token for it carries issues write and nothing else, and is minted only when
              an issue is to be closed.
              """
              owner, name = target["full_name"].split("/", 1)
              data = graphql(env, MERGED, {"owner": owner, "name": name})
              merged = data["repository"]["pullRequests"]["nodes"]
              bot = conf["bot_login"].removesuffix("[bot]")
              since = now - timedelta(days=CLOSE_DAYS)
              found = issues_to_close(merged, target["full_name"], bot, since)
              if not found:
                  return []
              try:
                  token = mint(env, conf, installation, ISSUE_RIGHTS, [target["name"]])
              except RefusedError as err:
                  numbers = ", ".join(f"#{issue}" for _, _, issue in found)
                  raise RefusedError(f"issues {numbers} stay open, no issues write: {err}") from err
              url = f"{env['GITHUB_API_URL']}/repos/{target['full_name']}/issues"
              lines = []
              try:
                  for number, oid, issue in found:
                      text = f"Closed by #{number}, which the merge train merged as {oid}."
                      call(f"{url}/{issue}/comments", token, "POST", {"body": text})
                      call(f"{url}/{issue}", token, "PATCH", {"state": "closed", "state_reason": "completed"})
                      lines.append(f"Closed issue #{issue}: #{number} merged as {oid[:7]}.")
              finally:
                  revoke(env, token)
              return lines


          def one(env, conf, installation, target, now):
              """The train in one repository, with a token for that repository alone."""
              rights = WRITE_RIGHTS if conf["switch"] == "on" else READ_RIGHTS
              token = mint(env, conf, installation, rights, [target["name"]])
              local = {**env, "GITHUB_REPOSITORY": target["full_name"], "TRAIN_TOKEN": token}
              closed = []
              try:
                  repo = fetch(local)
                  rows, notes, outcome = run(local, conf, repo, now)
                  if conf["switch"] == "on":
                      closed = close_issues(local, conf, installation, target, now)
              finally:
                  revoke(env, token)
              moved = any(
                  note.startswith(("armed", "updated", "queued", "refreshed"))
                  or note == "generated files committed"
                  for note in notes.values()
              )
              section = report(target["full_name"], repo, rows, notes, outcome) if rows else ""
              if closed:
                  section = section or f"### {target['full_name']}: {outcome}\n"
                  section += "\n" + "\n".join(closed) + "\n"
              return outcome, section, moved, bool(repo["releaseConfig"] and repo["releaseManifest"])


          def sweep(env, conf, started):
              """Run the train in every repository; the per-account tally, the sections, the refusals."""
              accounts, sections, refusals, skipped, releases, identity = {}, [], [], [], [], {}
              for installation in pages(env, app_jwt(env, conf), "/app/installations"):
                  account = installation["account"]["login"]
                  if installation.get("suspended_at"):
                      accounts[account] = "suspended"
                      continue
                  try:
                      targets = repositories(env, conf, installation, identity)
                  except RefusedError as err:
                      refusals.append(f"{account}: {err}")
                      accounts[account] = "refused"
                      continue
                  tally = {"repositories": 0, "landed": 0, "updated": 0, "refused": 0}
                  accounts[account] = tally
                  for target in targets:
                      if time.monotonic() - started > SWEEP_SECONDS:
                          skipped.append(target["full_name"])
                          continue
                      tally["repositories"] += 1
                      try:
                          now = datetime.now(UTC)
                          outcome, section, moved, release = one(
                              env, {**conf, **identity}, installation, target, now
                          )
                      except RefusedError as err:
                          tally["refused"] += 1
                          refusals.append(f"{target['full_name']}: {err}")
                          continue
                      tally["landed"] += outcome.startswith("landed")
                      tally["updated"] += moved
                      sections.append(section)
                      if release:
                          releases.append({"owner": account, "name": target["name"]})
              return accounts, [s for s in sections if s], refusals, skipped, releases


          def append(path, text):
              with open(path, "a", encoding="utf-8") as handle:
                  handle.write(text)


          def summary(env, accounts, sections, refusals, skipped, releases):
              lines = [
                  "## Merge train sweep",
                  "",
                  "| Account | Repositories | Landed | Updated | Refused |",
                  "|---|---|---|---|---|",
              ]
              for account, tally in sorted(accounts.items(), key=lambda item: item[0].lower()):
                  if isinstance(tally, str):
                      lines.append(f"| {account} | {tally} | | | |")
                  else:
                      lines.append(
                          f"| {account} | {tally['repositories']} | {tally['landed']} "
                          f"| {tally['updated']} | {tally['refused']} |"
                      )
              if refusals:
                  lines += ["", "Refused:", ""] + [f"- {line}" for line in refusals]
              if skipped:
                  lines += ["", f"Not reached within {SWEEP_SECONDS} s: {', '.join(skipped)}"]
              if len(releases) > MAX_RELEASES:
                  late = ", ".join(f"{r['owner']}/{r['name']}" for r in releases[MAX_RELEASES:])
                  lines += ["", f"No release run, the job matrix holds {MAX_RELEASES}: {late}"]
                  del releases[MAX_RELEASES:]
              named = ", ".join(f"{r['owner']}/{r['name']}" for r in releases) or "none"
              lines += ["", f"Release pull requests and releases next: {named}"]
              text = "\n".join([*lines, "", *sections]) + "\n"
              sys.stdout.write(text)
              append(env["GITHUB_STEP_SUMMARY"], text)
              append(env["GITHUB_OUTPUT"], f"releases={json.dumps(releases, separators=(',', ':'))}\n")


          def main(env):
              try:
                  conf = settings(env)
              except InvalidSettingError as err:
                  sys.stdout.write(f"::error title=Merge train setting::{err}\n")
                  return 3
              try:
                  accounts, sections, refusals, skipped, releases = sweep(env, conf, time.monotonic())
              except RefusedError as err:
                  sys.stdout.write(f"::error title=Merge train refused::{err}\n")
                  return 1
              summary(env, accounts, sections, refusals, skipped, releases)
              for line in refusals:
                  sys.stdout.write(f"::error title=Merge train refused::{line}\n")
              if skipped:
                  sys.stdout.write(f"::warning title=Merge train::{len(skipped)} repositories not reached\n")
              return 1 if refusals else 0


          sys.exit(main(os.environ))

  release:
    # release-please in every repository the sweep found with
    # release-please-config.json and .release-please-manifest.json on its
    # default branch, with a token of the app limited to that repository. Events
    # the app's token causes start workflow runs, so the release pull request
    # gets its required checks and a release starts the repository's
    # `release: published` workflows; with GITHUB_TOKEN neither happens.
    #
    # The job splits release creation and release pull request updates into
    # separate steps (decision records 0031, 0040): repositories that write
    # their own releases skip release creation and have their labels moved once
    # the tag is on the merge commit, while a pre-existing release is verified
    # and accepted if already complete.
    name: Release pull request and release
    needs: train
    if: >-
      ${{ !cancelled() && inputs.switch == 'on'
      && needs.train.outputs.releases != '' && needs.train.outputs.releases != '[]' }}
    runs-on: ${{ inputs.runner }}
    environment: merge-train
    timeout-minutes: 15
    permissions: {}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        repository: ${{ fromJSON(needs.train.outputs.releases) }}
    steps:
      - name: Mint a token for this repository alone
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ matrix.repository.owner }}
          repositories: ${{ matrix.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Write the release labels module
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release_labels.py" <<'PY'
          """Release settings and label handling for release-please."""

          import base64
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          PENDING_LABEL = "autorelease: pending"
          TAGGED_LABEL = "autorelease: tagged"
          TIMEOUT = 30
          MAX_BYTES = 1024 * 1024


          class CallError(Exception):
              """A forge call failed or returned an error status; `status` is the HTTP code, if any."""

              def __init__(self, message, status=None):
                  super().__init__(message)
                  self.status = status


          def call(url, token, method="GET", body=None, status_only=False):
              """Execute one HTTP request to the forge, with bounded read and timeout."""
              data = None if body is None else json.dumps(body).encode("utf-8")
              req = urllib.request.Request(url, data=data, method=method)
              if token:
                  req.add_header("Authorization", f"Bearer {token}")
              req.add_header("Accept", "application/vnd.github+json")
              req.add_header("X-GitHub-Api-Version", "2022-11-28")
              try:
                  with urllib.request.urlopen(req, timeout=TIMEOUT) as resp:
                      raw = resp.read(MAX_BYTES + 1)
                      if len(raw) > MAX_BYTES:
                          raise CallError(f"{method} {url}: body exceeds {MAX_BYTES} bytes")
                      if status_only:
                          return resp.status, raw
                      try:
                          parsed = json.loads(raw.decode("utf-8")) if raw else {}
                      except json.JSONDecodeError as err:
                          raise CallError(f"{method} {url}: invalid JSON response: {err}") from err
                      return resp.status, parsed
              except urllib.error.HTTPError as err:
                  if status_only:
                      return err.code, b""
                  raw = err.read(MAX_BYTES + 1)
                  detail = raw.decode("utf-8", errors="replace")[:200]
                  raise CallError(f"{method} {url}: HTTP {err.code}: {detail}", err.code) from err
              except (urllib.error.URLError, TimeoutError) as err:
                  raise CallError(f"{method} {url}: connection error: {err}") from err


          def read_config(api_url, repo, token):
              """Read and parse release-please-config.json via the contents API."""
              url = f"{api_url}/repos/{repo}/contents/release-please-config.json"
              _, data = call(url, token, method="GET")
              raw = data.get("content", "")
              try:
                  decoded = base64.b64decode(raw).decode("utf-8")
                  return json.loads(decoded)
              except ValueError as err:
                  raise CallError(f"parse release-please-config.json: {err}") from err


          def evaluate_skip(config):
              """Determine effective skip-github-release across packages."""
              top = config.get("skip-github-release", False)
              packages = config.get("packages")
              if not packages or not isinstance(packages, dict):
                  return bool(top)
              pkg_skips = {}
              for name, pkg in sorted(packages.items())[:100]:
                  val = pkg.get("skip-github-release", top) if isinstance(pkg, dict) else top
                  pkg_skips[name] = bool(val)
              values = set(pkg_skips.values())
              if len(values) > 1:
                  details = ", ".join(f"{k}={v}" for k, v in pkg_skips.items())
                  raise ValueError(f"mixed skip-github-release across packages: {details}")
              return next(iter(values))


          def package_settings(config, component):
              """The settings of the package a release branch names, over the top-level ones."""
              packages = config.get("packages") if isinstance(config.get("packages"), dict) else {}
              entries = [p for p in list(packages.values())[:100] if isinstance(p, dict)]
              named = [
                  p for p in entries if component and component in (p.get("component"), p.get("package-name"))
              ]
              package = named[0] if named else entries[0] if len(entries) == 1 else {}
              keys = (
                  "include-component-in-tag",
                  "include-v-in-tag",
                  "tag-separator",
                  "pull-request-title-pattern",
              )
              return {key: package.get(key, config.get(key)) for key in keys}


          def release_tag(pull, config):
              """The tag release-please gives a merged release pull request, or None for any other pull."""
              base_ref = (pull.get("base") or {}).get("ref") or ""
              head_ref = (pull.get("head") or {}).get("ref") or ""
              # release-please's branch names: release-please--branches--<base>[--components--<component>]
              branch = re.fullmatch(
                  rf"release-please--branches--{re.escape(base_ref)}(?:--components--(.+))?", head_ref
              )
              if not base_ref or not branch:
                  return None
              component = branch.group(1) or ""
              settings = package_settings(config, component)
              if settings["pull-request-title-pattern"]:
                  return None
              # release-please's default title pattern, chore${scope}: release${component} ${version}.
              title = re.fullmatch(
                  r"chore(?:\((?P<branch>[\w./-]+)\))?: release ?(?:@?[\w./-]*)? "
                  r"v?(?P<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?)",
                  pull.get("title") or "",
              )
              if not title or title.group("branch") not in (None, base_ref):
                  return None
              prefix = "v" if settings["include-v-in-tag"] is not False else ""
              if component and settings["include-component-in-tag"] is not False:
                  separator = settings["tag-separator"] if isinstance(settings["tag-separator"], str) else "-"
                  prefix = f"{component}{separator}{prefix}"
              return prefix + title.group("version")


          def parse_release_pull(pull, config):
              """Validate a merged release pull request and return item dict or None."""
              labels = {lbl.get("name") for lbl in pull.get("labels", []) if isinstance(lbl, dict)}
              if PENDING_LABEL not in labels:
                  return None
              num = pull.get("number")
              sha = pull.get("merge_commit_sha") or ""
              tag = release_tag(pull, config)
              if not (pull.get("merged_at") and tag and re.fullmatch(r"[0-9a-fA-F]{40}", sha)):
                  sys.stdout.write(f"::warning::pull #{num} labelled {PENDING_LABEL} fails release checks\n")
                  return None
              return {"number": num, "sha": sha, "tag": tag}


          def read_pending(api_url, repo, token, config):
              """List merged release pull requests still carrying autorelease: pending."""
              url = f"{api_url}/repos/{repo}/pulls?state=closed&per_page=20"
              _, pulls = call(url, token, method="GET")
              if not isinstance(pulls, list):
                  raise CallError(f"GET {url}: expected list of pulls")
              pending = []
              for pull in pulls[:20]:
                  item = parse_release_pull(pull, config)
                  if item is not None:
                      pending.append(item)
              return pending


          def cmd_settings(env):
              """Read release settings and emit skip and pending outputs."""
              api_url = env.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
              repo = env["REPO"]
              token = env["TOKEN"]
              config = read_config(api_url, repo, token)
              try:
                  skip = evaluate_skip(config)
              except ValueError as err:
                  sys.stdout.write(f"::error::{err}\n")
                  return 1
              pending = read_pending(api_url, repo, token, config)
              out_file = env.get("GITHUB_OUTPUT")
              if out_file:
                  skip_str = "true" if skip else "false"
                  pending_str = json.dumps(pending, separators=(",", ":"))
                  with open(out_file, "a", encoding="utf-8") as f:
                      f.write(f"skip={skip_str}\npending={pending_str}\n")
              return 0


          def get_tag_commit(api_url, repo, token, tag):
              """Resolve the commit SHA for a tag ref, unwrapping annotated tags once."""
              tag_quoted = urllib.parse.quote(tag, safe="")
              url = f"{api_url}/repos/{repo}/git/matching-refs/tags/{tag_quoted}"
              try:
                  _, entries = call(url, token, method="GET")
              except CallError as err:
                  if err.status == 404:
                      return None
                  raise
              if not isinstance(entries, list):
                  return None
              if len(entries) >= 30:
                  raise CallError(f"matching-refs for {tag}: {len(entries)} entries (>= 30)")
              exact = f"refs/tags/{tag}"
              entry = None
              for item in entries[:30]:
                  if item.get("ref") == exact:
                      entry = item
                      break
              if not entry:
                  return None
              obj = entry.get("object", {})
              obj_type = obj.get("type")
              sha = obj.get("sha")
              if obj_type == "commit":
                  return sha
              if obj_type == "tag" and sha:
                  tag_url = f"{api_url}/repos/{repo}/git/tags/{sha}"
                  _, tag_data = call(tag_url, token, method="GET")
                  target_obj = tag_data.get("object", {})
                  if target_obj.get("type") == "commit":
                      return target_obj.get("sha")
              return None


          def move_pending_labels(api_url, repo, token, pending):
              """For each pending item with tag on commit: add tagged label, then delete pending."""
              for item in pending[:100]:
                  commit = get_tag_commit(api_url, repo, token, item["tag"])
                  if commit == item["sha"]:
                      num = item["number"]
                      post_url = f"{api_url}/repos/{repo}/issues/{num}/labels"
                      call(post_url, token, method="POST", body={"labels": [TAGGED_LABEL]})
                      del_quoted = urllib.parse.quote(PENDING_LABEL, safe="")
                      del_url = f"{api_url}/repos/{repo}/issues/{num}/labels/{del_quoted}"
                      call(del_url, token, method="DELETE")
                  else:
                      sys.stdout.write(
                          f"::notice::pull #{item['number']} stays pending (tag not yet on merge commit)\n"
                      )
              return 0


          def judge_failed_release(api_url, repo, token, pending):
              """Judge a failed release-please run when releases were not skipped."""
              if not pending:
                  sys.stdout.write("::error::release step failed and pending is empty\n")
                  return 1
              for item in pending[:100]:
                  pull_url = f"{api_url}/repos/{repo}/pulls/{item['number']}"
                  _, pull = call(pull_url, token, method="GET")
                  labels = {lbl.get("name") for lbl in pull.get("labels", []) if isinstance(lbl, dict)}
                  if PENDING_LABEL in labels:
                      sys.stdout.write(f"::error::pull #{item['number']} still carries {PENDING_LABEL}\n")
                      return 1
                  commit = get_tag_commit(api_url, repo, token, item["tag"])
                  if commit != item["sha"]:
                      sys.stdout.write(f"::error::tag {item['tag']} commit {commit} != {item['sha']}\n")
                      return 1
                  tag_quoted = urllib.parse.quote(item["tag"], safe="")
                  rel_url = f"{api_url}/repos/{repo}/releases/tags/{tag_quoted}"
                  status, _ = call(rel_url, token, method="GET", status_only=True)
                  if status != 200:
                      sys.stdout.write(f"::error::release {item['tag']} returned HTTP {status}\n")
                      return 1
              for item in pending[:100]:
                  sys.stdout.write(f"::notice::release {item['tag']} existed on the release commit; done\n")
              return 0


          def cmd_after(env):
              """Move release labels or judge a failed release run."""
              api_url = env.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
              repo = env["REPO"]
              token = env["TOKEN"]
              skip = env.get("SKIP", "false").lower() == "true"
              outcome = env.get("OUTCOME", "")
              raw_pending = env.get("PENDING", "[]")
              pending = json.loads(raw_pending) if raw_pending else []
              if skip:
                  return move_pending_labels(api_url, repo, token, pending)
              if outcome in ("success", "skipped"):
                  return 0
              if outcome == "failure":
                  return judge_failed_release(api_url, repo, token, pending)
              sys.stdout.write(f"::error::unexpected release outcome: {outcome}\n")
              return 1


          def main(argv, env):
              """Dispatch settings or after command."""
              if len(argv) < 2:
                  sys.stderr.write("usage: release_labels.py <settings|after>\n")
                  return 2
              commands = {"settings": cmd_settings, "after": cmd_after}
              if argv[1] not in commands:
                  sys.stderr.write(f"unknown command: {argv[1]}\n")
                  return 2
              try:
                  return commands[argv[1]](env)
              except (CallError, KeyError, json.JSONDecodeError) as err:
                  sys.stdout.write(f"::error title=Release labels::{argv[1]}: {err}\n")
                  return 1


          if __name__ == "__main__":
              sys.exit(main(sys.argv, os.environ))
          PY

      - name: Read the release settings
        id: settings
        shell: bash
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ matrix.repository.owner }}/${{ matrix.repository.name }}
        run: python3 "$RUNNER_TEMP/release_labels.py" settings

      - name: Create the releases of merged release pull requests
        id: release
        if: steps.settings.outputs.skip == 'false'
        continue-on-error: true
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}
          repo-url: ${{ matrix.repository.owner }}/${{ matrix.repository.name }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      - name: Move the labels, or judge a failed release run
        shell: bash
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ matrix.repository.owner }}/${{ matrix.repository.name }}
          SKIP: ${{ steps.settings.outputs.skip }}
          OUTCOME: ${{ steps.release.outcome }}
          PENDING: ${{ steps.settings.outputs.pending }}
        run: python3 "$RUNNER_TEMP/release_labels.py" after

      - name: Open or update the release pull request
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}
          repo-url: ${{ matrix.repository.owner }}/${{ matrix.repository.name }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
