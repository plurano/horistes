---
# praetorctl adopt wrote this file for actionlint, which rejects a runs-on label
# missing from its built-in table of GitHub-hosted runners unless it is declared
# under self-hosted-runner.labels. Each label below is one a Praetor-managed
# workflow runs on that actionlint v1.7.12 does not know. Adoption only adds a
# missing label and never removes one, so keep your own settings here, and
# delete a label once your actionlint accepts .github/workflows without it.
self-hosted-runner:
  labels:
    - ubuntu-26.04
# Accepted findings, one file per key; tools/exceptions.py fails the gate on an
# entry without `# expires YYYY-MM-DD: reason` and on an expired one.
paths:
  # actionlint 1.7.12, the newest release, does not know the documented
  # job.workflow_repository and job.workflow_sha (rhysd/actionlint#705); the
  # train checks out its own script with them.
  .github/workflows/hook-copy.yml:
    ignore:
      - 'property "workflow_(repository|sha)" is not defined' # expires 2027-01-20: actionlint lacks job.workflow_*
  .github/workflows/merge-train.yml:
    ignore:
      - 'property "workflow_(repository|sha)" is not defined' # expires 2027-01-20: actionlint lacks job.workflow_*
  .github/workflows/secret-scan.yml:
    ignore:
      - 'property "workflow_(repository|sha)" is not defined' # expires 2027-01-20: actionlint lacks job.workflow_*
