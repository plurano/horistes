#
# Hosts the workflows and actions of this repository may reach, read by
# tools/hosts.py. A host missing here fails the gate, and so does a host
# declared here that no file names any more.

# The forge itself: reachable from every file without a declaration.
forge = [
    "github.com",
    "api.github.com",
    "uploads.github.com",
    "codeload.github.com",
    "raw.githubusercontent.com",
    "objects.githubusercontent.com",
    "release-assets.githubusercontent.com",
    "token.actions.githubusercontent.com",
    # Where job summaries, logs, artifacts and caches are stored (GitHub Docs,
    # "Self-hosted runners reference", essential communications; read
    # 2026-10-11). The storage accounts are numbered, so the forge names them
    # by pattern only.
    "results-receiver.actions.githubusercontent.com",
    "*.blob.core.windows.net",
    "ghcr.io",
]

# The outside actions a file here may use, each with the hosts it reaches by
# itself beyond the forge. An action missing here fails the gate.
[actions]
"actions/checkout" = []
# Mints and revokes an installation token through the forge's API.
"actions/create-github-app-token" = []
# Takes the toolchain from the runner's cache or the forge-hosted manifest;
# when both miss it downloads from the Go distribution site, which redirects.
"actions/setup-go" = ["go.dev", "dl.google.com"]
# Uploads to the forge's artifact storage.
"actions/upload-artifact" = [
    "results-receiver.actions.githubusercontent.com",
    "*.blob.core.windows.net",
]
# Uploads to the forge's code scanning through its API.
"github/codeql-action/upload-sarif" = []
# Bundled in its own dist/index.js; reads and writes through the forge's REST
# and GraphQL API, and links commits on the forge (`changelog-host`).
"googleapis/release-please-action" = []
# Runs from its image on the forge's registry. The first four hosts are asked
# on every run, the last four only when the result is published (sources in
# decision record 0013).
"ossf/scorecard-action" = [
    "www.bestpractices.dev",
    "api.deps.dev",
    "api.osv.dev",
    "oss-fuzz-build-logs.storage.googleapis.com",
    "api.scorecard.dev",
    "fulcio.sigstore.dev",
    "rekor.sigstore.dev",
    "tuf-repo-cdn.sigstore.dev",
]

# This repository's own gate. It is no reusable workflow, so no input switches
# these hosts off; each is named with what needs it.
[files.".github/workflows/ci.yml"."go.dev"]
reason = "Go toolchain for the engine build, when the runner's cache and the forge manifest miss"

[files.".github/workflows/ci.yml"."dl.google.com"]
reason = "target of the Go distribution site's download redirect"

[files.".github/workflows/ci.yml"."proxy.golang.org"]
reason = "modules of the pinned engine commit"

[files.".github/workflows/ci.yml"."sum.golang.org"]
reason = "checksum database for those modules"

[files.".github/workflows/ci.yml"."pypi.org"]
reason = "index of the hash-pinned tools in requirements/tools.txt, installed by `make tools`"

[files.".github/workflows/ci.yml"."files.pythonhosted.org"]
reason = "files of those tools"

# The pin check of this repository's own workflows (decision record 0017). It
# is no reusable workflow, so no input switches these hosts off. zizmor and the
# tool ask only the forge.
[files.".github/workflows/pins.yml"."pypi.org"]
reason = "index of the hash-pinned tools in requirements/tools.txt, installed by `make tools`"

[files.".github/workflows/pins.yml"."files.pythonhosted.org"]
reason = "files of those tools"

# The shared licence workflow runs the licence tool's public image, named by
# digest (decision record 0008). The host has no off switch: it is an exception
# with a day it ends (decision record 0005), and it leaves when a pinned image
# of the licence tool is on the forge's registry.
[files.".github/workflows/licence.yml"."docker.io"]
reason = "image of the licence tool, named by digest; no pinned copy on the forge's registry yet"
expires = 2026-12-31

# The age check of the licence tool's pinned image (decision record 0035). It
# is no reusable workflow, so no input switches the host off. It leaves with
# the docker.io exception above, when a pinned image of the licence tool is on
# the forge's registry.
[files.".github/workflows/image-age.yml"."hub.docker.com"]
reason = "tag list of the licence tool's image: release names, push days and digests"

# The shared scorecard workflow. The action has no switch for the hosts it
# asks, so `outside_hosts` gates the whole job. A host that is asked with the
# name of the calling repository is for public repositories only (decision
# record 0013).
[files.".github/workflows/scorecard.yml"."www.bestpractices.dev"]
reason = "best-practices badge of the repository, asked by its name"
input = "outside_hosts"
public_only = true

[files.".github/workflows/scorecard.yml"."api.deps.dev"]
reason = "dependency insight for the repository, asked by its name"
input = "outside_hosts"
public_only = true

[files.".github/workflows/scorecard.yml"."api.osv.dev"]
reason = "known vulnerabilities of the dependencies found in the checkout"
input = "outside_hosts"

[files.".github/workflows/scorecard.yml"."oss-fuzz-build-logs.storage.googleapis.com"]
reason = "list of the projects the public fuzzing service builds"
input = "outside_hosts"

[files.".github/workflows/scorecard.yml"."api.scorecard.dev"]
reason = "publication of the result under the repository's name"
input = "publish"
public_only = true

[files.".github/workflows/scorecard.yml"."fulcio.sigstore.dev"]
reason = "signing certificate for the published result"
input = "publish"
public_only = true

[files.".github/workflows/scorecard.yml"."rekor.sigstore.dev"]
reason = "transparency log entry for the published result"
input = "publish"
public_only = true

[files.".github/workflows/scorecard.yml"."tuf-repo-cdn.sigstore.dev"]
reason = "trust root of the signing service"
input = "publish"
public_only = true
