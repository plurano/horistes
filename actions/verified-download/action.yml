---
name: Verified download
description: Bounded, digest-verified release download over HTTPS with GitHub CLI release fallback.

inputs:
  url:
    description: HTTPS URL of the file to download; leave url, sha256 and output empty to get only the lib output.
    required: false
    default: ""
  sha256:
    description: Expected SHA-256 digest of the downloaded file.
    required: false
    default: ""
  output:
    description: Destination path for the downloaded file.
    required: false
    default: ""
  max-bytes:
    description: Maximum download size in bytes.
    required: false
    default: "33554432"
  timeout-seconds:
    description: >-
      Maximum time in seconds for curl with its retries, and again for the gh release download fallback;
      a command still running 5 seconds after its deadline is killed,
      so one call takes at most twice this plus 10 seconds.
    required: false
    default: "120"

outputs:
  lib:
    description: >-
      Absolute path of verified-download.sh so callers can source it directly;
      a step that sources it sets GH_TOKEN for the gh release download fallback.
    value: ${{ steps.download.outputs.lib }}

runs:
  using: composite
  steps:
    - id: download
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        DOWNLOAD_URL: ${{ inputs.url }}
        DOWNLOAD_SHA256: ${{ inputs.sha256 }}
        DOWNLOAD_OUTPUT: ${{ inputs.output }}
        DOWNLOAD_MAX_BYTES: ${{ inputs.max-bytes }}
        DOWNLOAD_TIMEOUT: ${{ inputs.timeout-seconds }}
      run: |
        echo "lib=${GITHUB_ACTION_PATH}/verified-download.sh" >> "$GITHUB_OUTPUT"
        if [[ -z "$DOWNLOAD_URL$DOWNLOAD_SHA256$DOWNLOAD_OUTPUT" ]]; then
          exit 0
        fi
        if [[ -z "$DOWNLOAD_URL" || -z "$DOWNLOAD_SHA256" || -z "$DOWNLOAD_OUTPUT" ]]; then
          printf 'verified-download: url, sha256 and output are set together or not at all\n' >&2
          exit 1
        fi
        # shellcheck source=actions/verified-download/verified-download.sh
        . "$GITHUB_ACTION_PATH/verified-download.sh"
        fetch_verified "$DOWNLOAD_URL" "$DOWNLOAD_SHA256" "$DOWNLOAD_MAX_BYTES" "$DOWNLOAD_TIMEOUT" "$DOWNLOAD_OUTPUT"
