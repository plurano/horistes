# No package is built here: the product is workflow files. This file only
# configures the test runner of the checks under tools/.
[tool.bandit]
skips = ["B404", "B603", "B607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.coverage.run]
# Branch coverage counts both outcomes of every condition, not only the lines.
branch = true
# The directories under test; tests/ and fuzz/ are left out.
source = ["tools"]
# Many tests invoke tools and hooks as subprocesses; patch measures them.
patch = ["subprocess"]
# Default data file for a bare coverage command. The Makefile test recipe
# overrides it with --data-file in a temporary directory of its own.
data_file = ".coverage"

[tool.coverage.report]
# Missing line and branch numbers are shown in terminal reports.
show_missing = true
# Totals are compared at two decimals, so a total below the floor cannot round up to it.
precision = 2
# The gate fails below this total; raise it as coverage grows, never lower it.
fail_under = 94

# Codacy's Ruff passes ruff `--config` with the first of pyproject.toml,
# ruff.toml or .ruff.toml it lists at the root (codacy/codacy-ruff,
# src/codacy_ruff.py, find_ruff_configFile). Without this section a
# pick of this file runs ruff on its defaults: line length 88, target
# 3.10, where tomllib sorts as third party. Every root pick resolves to
# ruff.toml; tests/test_codacy_ruff_config.py holds that.
[tool.ruff]
extend = "ruff.toml"
