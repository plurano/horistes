# No package is built here: the product is workflow files. This file only
# configures the test runner of the checks under tools/.
[tool.bandit]
skips = ["B404", "B603", "B607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

# Codacy's Ruff passes ruff `--config` with the first of pyproject.toml,
# ruff.toml or .ruff.toml it lists at the root (codacy/codacy-ruff,
# src/codacy_ruff.py, find_ruff_configFile). Without this section a
# pick of this file runs ruff on its defaults: line length 88, target
# 3.10, where tomllib sorts as third party. Every root pick resolves to
# ruff.toml; tests/test_codacy_ruff_config.py holds that.
[tool.ruff]
extend = "ruff.toml"
