---
# Codacy configuration.
#
# Bandit B404/B603/B607 and Opengrep dangerous-subprocess-use-audit fire on
# every subprocess call in the repository; all 20+ call sites use static
# argument lists, not user input. Per-rule skipping is not available in
# .codacy.yml (it must be configured in the Codacy UI under Code patterns).
# The exclude_paths below keep non-source directories out of analysis.
#
# Ruff: the repository runs its own ruff (ruff check + ruff format --check)
# with a project ruff.toml. Codacy's default Ruff disagrees on import ordering
# inside try/except blocks. Disabling Ruff must be done in the Codacy UI.
exclude_paths:
  - ".workingdir/**"
