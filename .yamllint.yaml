---
extends: default

# .gitignore names every tree that is not this repository's source: .venv/,
# .workingdir/ and the npm tree `make opengrep-tools` installs (ADR-0084).
ignore-from-file: .gitignore

rules:
  line-length:
    max: 120
  # `on:` is a workflow key, not a boolean.
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
