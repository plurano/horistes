#
# Rule set of the engine's Python template. The target is 3.12, not the
# template's 3.14: CI runs the checks on the Python of the hosted runner image.
line-length = 100
target-version = "py312"

[lint]
# Codacy's ruff reports ISC; the repository's ruff must agree.
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "T20", "SIM", "ISC"]
ignore = []

# Every entry names one file and ends in `# expires YYYY-MM-DD category <A|B|C|D>: reason`;
# tools/exceptions.py fails an entry without it or past its day.
[lint.per-file-ignores]
".config/agent/hooks/block_evasion.py" = ["ISC001", "ISC004"] # expires 2026-11-18 category C: written by praetorctl adopt not edited by hand; ends when the engine render is ISC clean (engine-hook-render-isc-clean-20261108)

[lint.isort]
force-sort-within-sections = false
