# Archives with a signed checksums file; the signer is called by release.yml.
repository = "tekmora/epitrop"
signer = ".github/workflows/release-binaries.yml"
other_workflows = [".github/workflows/release.yml"]

[blobs]
checksums = "checksums.txt"
signature = "checksums.txt.sigstore.json"
