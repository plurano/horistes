# Exceptions to rules that neither the engine's list in .standards.yaml nor a
# linter's configuration can carry. One entry is one rule in one file, with the
# issue that tracks its cause, a reason and a day it ends, at most 90 days
# ahead. tools/exceptions.py is the only reader and fails the gate on an entry
# that is incomplete, expired or longer.
exceptions:
  - rule: CIIBestPracticesID
    path: .bestpractices.json
    issue: plurano/horistes#116
    category: C
    entered: "2026-11-07"
    reason: >-
      project answers are in .bestpractices.json; registration on
      bestpractices.dev approved, waiting for completion
    expires: "2026-11-17"
  - rule: zizmor ref-version-mismatch on branch comments
    path: tools/pins.py
    issue: zizmorcore/zizmor#2378
    category: D
    entered: "2026-11-09"
    reason: >-
      pins.py drops zizmor's branch-points-to-commit finding only when the
      forge compare puts the pinned commit on the named branch's history;
      error refuses; MEL category D; revisit when horistes ships release
      tags or zizmor judges branch history itself (the upstream issue)
    expires: "2027-03-09"
  - rule: ruff E501 on the opengrep suppression of the gh call
    path: tools/forge.py
    issue: plurano/horistes#161
    category: D
    entered: "2026-11-09"
    reason: >-
      the nosemgrep line above the gh call in download() names the full
      rule id, its expiry, its category and its reason on one line, which
      runs past 100 columns at that nesting; ruff exempts no nosemgrep
      comment, so a trailing noqa E501 binds that line alone; MEL category
      D; revisit when issue 161 settles the suppression form or the GH
      override leaves download()
    expires: "2027-03-09"
